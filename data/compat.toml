# 也可直接在该应用里右键输入法图标 →「应用独立配置」→「初始输入模式」→「英文」，
# 菜单会把等效规则写进用户层 compat.toml，无需手工编辑本文件。
# [[apps]]
# process = "Everything.exe"
# comment = "文件搜索框，默认英文"
# initial_mode = "english"

# 示例：表格类宿主关掉符号自动配对（默认不启用——是否需要由用户自己决定）
# 同样可在该应用里右键 →「应用独立配置」→「符号自动配对」→「禁用」。
# [[apps]]
# process = "EXCEL.EXE"
# comment = "输入态下方向键=移动单元格，配对光标无法退回符号之间"
