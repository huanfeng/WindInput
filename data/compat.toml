# 不必按显示器缩放折算——同一份数值换到不同缩放的屏幕上效果一致。
# [[apps]]
# process = "WindowsTerminal.exe"
# comment = "宿主上报的 caret 位置系统性偏移，其它输入法同样偏"
# caret_offset_x = 0
# caret_offset_y = -2


# ============================================================================
# [[initial_mode_scope]] —— per-app 初始模式的「作用域窗口类」
# ============================================================================
# 解决的问题：上面的 [[apps]] 规则按**进程映像名**匹配，而 explorer.exe 一个名字同时
# 承载语义相反的两类焦点：
#   · 桌面 —— 用户配 initial_mode = "english" 冲的就是它。
#   · 任务栏、Alt+Tab、任务视图、任务栏溢出区、资源管理器窗口 —— 点它是为了去别处，
#     或者另有用途（资源管理器的搜索/重命名框反而常要中文）。
# 后一类是每次切换应用的必经之路，被规则一并命中后，每切一次应用就会重算一次初始
# 中英状态，表现为语言栏图标频繁闪「英」。实测样本：非桌面 169 次、桌面 12 次。
#
# 语义：**只有本段列出的窗口类才允许重算该进程的初始模式**，其余一律保持现状。
# 只影响 per-app 初始中英/标点的重算，不影响该窗口的输入功能——任务栏搜索框照常
# 可以打字，只是不再把当前模式改掉。
#
# ★ 为什么是白名单而不是黑名单（列出哪些窗口是「过渡型」）：黑名单有两个失效面，
#   本机制初版就是黑名单，当天即被实测推翻——
#   ① 拿不到窗口类时（explorer 新起 TSF 连接后的头一个 focus_gained，此刻连 caret
#      都还没有）空类名不在黑名单里，被判成「不是过渡窗口」而放行，当场闪英；
#   ② Windows 每个版本都在新增 XAML 岛窗口类，漏一个就套错一次。
#   反过来做白名单，两种情况都自动落在作用域外 = 保持现状，而那正是唯一安全的答案。
#
# 字段:
#   process:  进程映像名（不区分大小写）
#   classes:  该进程下**允许重算初始模式**的顶层窗口类名（不区分大小写）
#             空清单 = 该进程的初始模式规则在任何窗口上都不重算
#
# 合并语义：用户层同名进程**整条覆盖**本段（与 [[apps]] 一致）。想增删其中一项时，
# 请把下面的 classes 整份抄进用户层 compat.toml 再改，只写要加的那一项会让其余几项失效。
# 例：想让资源管理器窗口也套用 explorer 的 initial_mode，就在用户层写
#     classes = ["Progman", "WorkerW", "CabinetWClass"]
#
# ⚠ 刻意不放进 [[apps]] 的字段里：那边同名进程是整条覆盖，用户只要为 explorer.exe
#   写任何一条自己的规则（哪怕只调 caret_offset），本清单就会连带消失。
#
# ⚠ 未在本段出现的进程**完全不受限制**（绝大多数应用），行为与本机制引入前一致。

[[apps]]
process = "wps.exe"
comment = "WPS 文字：组合起点每帧与插入点同步右移（矩形恒 w=2，起点即插入点），大偏移逃生阀被这份漂移数据一路骗着重锁，实测把锚点从真实起点 1830 推到 2591；而删除是逐字的、每步 15~30px 够不到 3 倍行高阈值，锚点就永久卡住，候选窗离组合区 868px。钉在首帧起点即可——首帧 compStart 是对的。⚠ 不可改成全局：Excel / et.exe 矩形形态完全相同，但它们每字换一次 docMgr、候选窗本就该跟着单元格走，靠的正是逃生阀"
pin_anchor_when_start_drifts = true

[[apps]]
process = "WINWORD.EXE"
comment = "Microsoft Word：与 WPS 文字同类，长组合内组合起点跟着插入点走。其 cached 帧另有 w=0 的退化矩形（坐标是另一处的陈旧值），那条由全局的「退化帧整帧不可信」判据挡掉，与本开关无关"
pin_anchor_when_start_drifts = true

[[initial_mode_scope]]
process = "explorer.exe"
comment = "Windows 资源管理器：initial_mode 只作用于桌面本身，任务栏/切换器/文件管理器窗口保持现状"
classes = [
  "Progman", # 桌面（常规）
  "WorkerW", # 桌面（壁纸切换 / 幻灯片放映期间的桌面顶层窗口）
]

# ============================================================================
# [[commit_newline]] —— per-app 的「上屏换行用什么字符表达」
# ============================================================================
# 全局默认档在 config.toml 的 input.commit_newline（出厂 "keep" = 原样透传），
# 本段按进程名覆盖它。取值：keep / cr / lf / crlf。
#
# 解决的问题：「换行」在不同宿主的文本模型里根本不是同一个东西。
#   · 富文本模型（RichEdit / TOM 这条线）的文档存储里，段落边界**就是** CR。LF 在那里
#     不是「另一种换行写法」，而是个不构成换行的控制字符——2026-08-23 真机现场：同一段
#     带换行的文本，Word 里每个换行处渲染成一段类似 Tab 的空白。
#   · 而 VS Code / 终端 / 浏览器输入框是「写进去什么就存什么」，在那里做任何转换都是在
#     改写用户的数据（论坛 t112：正则直通后行尾从 \n 变成 \r，用户很久之后才发现）。
#
# ★ 为什么出厂默认是 keep、名单只列需要转换的那几个：两个方向的漏配代价不对称。
#   漏配一个富文本宿主 ⇒ 用户立刻看见换行显示不对，能反馈、加一行即可；
#   反过来默认转换而漏配一个字节存储宿主 ⇒ 行尾被静默改写，用户根本不知道。
#   可见的失败优于静默的失败。
#
# ⚠ 本段与 [[apps]] 各自独立合并，互不牵连：你给 WINWORD.EXE 写自己的 [[apps]] 规则，
#   不会把这里的 cr 顶掉；反过来也一样。（为什么不做成 [[apps]] 的字段，见源码
#   CommitNewlineRule 的文档——理由是值域与写回路径，不是合并语义。）
#
# ⚠ style 拼错或漏写不会让本文件失效，只会让那条规则退化成「跟随全局」。
#
# ⚠ 仅 Windows 生效。macOS 的 IMKit 用 LF，不参与本项。
#
# 遇到别的宿主换行显示不对（渲染成方块/空白、整段挤成一行），照下面的格式加一条即可。

[[commit_newline]]
process = "WINWORD.EXE"
comment = "Microsoft Word：文档存储的段落边界是 CR，LF 落进去不构成段落（2026-08-23 真机实测）。⚠ 同现场实测『记事本与 WPS 文字正常分段』，故 wps.exe 刻意不在此列——按『富文本模型』推理会想当然地把它加进来，实测说的是反话"
style = "cr"
