# WindInput 候选注释内置模板与出厂分配
#
# 自定义：不要改本文件。用户的模板与分配写在 config.toml 的 [ui.comment]
# （[[ui.comment.templates]] 与 [ui.comment.assign.*]），同 id 的用户模板覆盖内置，
# 用户分配优先于本文件；想让某条出厂分配失效，在用户分配里写 "inherit"。
#
# 模板串语法见 https://windinput.com/docs/settings/appearance/candidate-comment
#
# 格值：模板 id / "none"（不显示）/ "inherit"（跟随下一层）。
# 键名：default_vertical / default_horizontal / detail_vertical / detail_horizontal。

[[templates]]
id = "code_hint"
name = "编码提示"
text = "${code_hint|code_rev|shuangpin}"

[[templates]]
id = "pinyin"
name = "拼音"
text = "${pinyin}"

[[templates]]
id = "chaizi"
name = "拆字"
text = "${chaizi}"

[[templates]]
id = "chaizi_code"
name = "拆字+编码"
text = "${chaizi} ${chaizi_code}"

[[templates]]
id = "chaizi_pinyin"
name = "拆字+拼音"
text = "${chaizi}{ · ${pinyin}}"

[[templates]]
id = "en_meaning"
name = "英文释义"
text = "${dict:en_zh}"

[[templates]]
id = "zh_english"
name = "中文对应英文"
text = "${dict:zh_en}"

[[templates]]
id = "pinyin_english"
name = "拼音+英文"
text = "${pinyin}{ · ${dict:zh_en}}"

[[templates]]
id = "detail_full"
name = "详细（全部）"
text = "${chaizi}{ · ${pinyin}}{ · ${dict:zh_en}}"

# 出厂分配
[assign.global]
default_vertical = "code_hint"
detail_vertical = "detail_full"

[assign.type.codetable]
detail_vertical = "chaizi_pinyin"

[assign.type.pinyin]
detail_vertical = "pinyin_english"

[assign.type.shuangpin]
detail_vertical = "pinyin_english"

[assign.type.english]
default_vertical = "none"
detail_vertical = "en_meaning"

[assign.mode.temp_english]
default_vertical = "none"
detail_vertical = "en_meaning"

[assign.mode.temp_pinyin]
detail_vertical = "chaizi_code"

# 内置注释词库（路径相对数据目录）
[[dicts]]
id = "en_zh"
label = "英汉释义"
path = "comments/en_zh.txt"

[[dicts]]
id = "zh_en"
label = "汉英释义"
path = "comments/zh_en.txt"
