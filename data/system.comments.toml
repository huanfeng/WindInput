# WindInput 候选注释内置模板与出厂分配
#
# 自定义：不要改本文件。用户的模板与分配写在 config.toml 的 [ui.comment]
# （[[ui.comment.templates]] 与 [ui.comment.assign.*]），同 id 的用户模板覆盖内置，
# 用户分配优先于本文件；想让某条出厂分配失效，在用户分配里写 "inherit"。
#
# 模板串语法见 https://windinput.com/docs/settings/appearance/candidate-comment
#
# 格值：模板 id / "none"（不显示）/ "inherit"（跟随下一层同排布）。
# 键名：default_horizontal / default_vertical / detail_horizontal / detail_vertical。
# 横排为主：竖排格不写时，本层横排格有值就同横排，否则跟随下一层竖排；
# 横排格不写即跟随下一层横排。出厂分配只写横排格。

[[templates]]
id = "code"
name = "编码"
text = "${code_hint|code_rev|shuangpin}"

[[templates]]
id = "code_hint"
name = "补全编码"
text = "${code_hint}"

[[templates]]
id = "code_rev"
name = "码表编码"
text = "${code_hint|code_rev}"

[[templates]]
id = "shuangpin"
name = "双拼编码"
text = "${code_hint|shuangpin}"

[[templates]]
id = "pinyin"
name = "拼音"
text = "${pinyin}"

[[templates]]
id = "chaizi"
name = "拆字"
text = "${chaizi}"

[[templates]]
id = "chaizi_code"
name = "拆字 · 编码"
text = "${chaizi}{ · ${code_rev|chaizi_code}}"

[[templates]]
id = "chaizi_pinyin"
name = "拆字 · 拼音"
text = "${chaizi}{ · ${pinyin}}"

[[templates]]
id = "zh_en"
name = "英文释义"
text = "${dict:zh_en}"

[[templates]]
id = "en_zh"
name = "中文释义"
text = "${dict:en_zh}"

[[templates]]
id = "pinyin_en"
name = "拼音 · 英文"
text = "${pinyin}{ · ${dict:zh_en}}"

[[templates]]
id = "full"
name = "拆字 · 拼音 · 英文"
text = "${chaizi}{ · ${pinyin}}{ · ${dict:zh_en}}"

# 出厂分配。编码类变量（code_rev / shuangpin）不再有档位开关，显不显示全看这里分到的模板：
# 拼音 / 双拼默认不显示，混输给码表编码，临时拼音与快捷输入给完整的编码回退链。
[assign.global]
default_horizontal = "code"
detail_horizontal = "full"

# 码表默认态跟随全局：主路上没有拼音来源候选，code 与 code_hint 效果相同。
[assign.type.codetable]
detail_horizontal = "chaizi_pinyin"

[assign.type.pinyin]
default_horizontal = "none"
detail_horizontal = "pinyin_en"

[assign.type.shuangpin]
default_horizontal = "none"
detail_horizontal = "pinyin_en"

[assign.type.mixed]
default_horizontal = "code_rev"

[assign.type.english]
default_horizontal = "none"
detail_horizontal = "en_zh"

[assign.mode.temp_english]
default_horizontal = "none"
detail_horizontal = "en_zh"

# 临时拼音、快捷输入的上级是当前方案（拼音方案下会落到 none），默认态显式写上编码。
# mode.mix 通配全部快捷输入；单个快捷输入另写 mode."mix:<id>" 覆盖。
[assign.mode.temp_pinyin]
default_horizontal = "code"
detail_horizontal = "chaizi_code"

[assign.mode.mix]
default_horizontal = "code"

# 内置注释词库（路径相对数据目录）
[[dicts]]
id = "en_zh"
label = "英汉释义"
path = "comments/en_zh.txt"

[[dicts]]
id = "zh_en"
label = "汉英释义"
path = "comments/zh_en.txt"
