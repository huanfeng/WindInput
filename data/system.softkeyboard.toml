# WindInput 软键盘
#
# 自定义：把本文件拷贝到 %APPDATA%\WindInput\system.softkeyboard.toml 后修改，
# 重启输入法服务生效。用户目录那份按面合并，不必抄全文（见下「用户覆盖」）。
#
# 面分两种：符号面出符号（敲哪个键、点哪个键帽都出这里配的字符），
# 键盘面把按键交还输入法、照常打字（send_keys，见下）。
# 功能键（Tab / Enter / 退格 / 空格 / Ins / Del / 方向键）一律透传，不参与映射。
#
# 字段
#   id          面的标识，唯一。热键 "softkeyboard:<id>" 可直接切到这一面
#   name        面的显示名，出现在标签行和面名键上
#   rows        基础层画布，四行
#   rows_shift  按住 Shift 时的第二层，可省略（省略即第二层为空）
#   keys        单键补丁，压在画布之上，形如 { q = "√", "shift+q" = "∛" }
#   send_keys   这一面「发送按键」而不是直接上屏符号，见下
#
# 画布怎么写
#   四行分别对应键盘的：数字行 / QWERTY 行 / ASDF 行 / ZXCV 行，
#   每行用空格分开，第 n 个符号落到该行第 n 个键上：
#
#     rows = [
#       "· ！ ？ 。 ， ； … — ‧ （ ） 〜 ＝",   # ` 1 2 3 4 5 6 7 8 9 0 - =
#       "“ ” ‘ ’ 《 》 【 】 ｛ ｝ 〔 〕 ＼",   # q w e r t y u i o p [ ] \
#       "、 。 ， ； ： ？ ！ ‥ ※ ： ＇",         # a s d f g h j k l ; '
#       "〃 〆 ‰ § † ‖ 〓 ＜ ＞ ／",             # z x c v b n m , . /
#     ]
#
#   写不满可以少写，末尾的键就是空的；写 . 表示这个键空着（按下没反应）。
#   要输出一个真正的句点，写 \. 。
#
# send_keys —— 键盘面 vs 符号面
#   符号面（默认）：画的是键盘打不出的字符，点一下就出那个字符，直接上屏。
#   键盘面（send_keys = true）：画的是键盘本来就有的键，点击合成一次真实按键交给
#   输入法，物理按键则完全不接管 —— 于是在这一面上打 nihao 出的是「你好」，
#   而不是往文档里塞五个字母。标准 PC 键盘面必须是这一种。
#
# 用户覆盖
#   用户目录那份按 id 与本文件对应：
#     只写 keys（不写 rows）  → 保留原画布，只改这几个键
#     写了 rows               → 这一面整个换成你的画布
#     id 是新的               → 多出一面，排在最后
#
# 补丁的键名
#   字母数字直接写；符号键用 grave ` / minus - / equal = / lbracket [ /
#   rbracket ] / backslash \ / semicolon ; / quote ' / comma , / period . / slash /
#   （符号本身也认，写 keys = { "[" = "【" } 一样生效）。
#   加 shift+ 前缀改第二层。写错的键名会被跳过并记进日志。

# ── PC键盘：键盘原字符 ──
[[pages]]
id = "pc"
name = "PC键盘"
# 键盘面：按键交还输入法，于是这一面能正常打中文。
send_keys = true
rows = [
  "` 1 2 3 4 5 6 7 8 9 0 - =",
  "q w e r t y u i o p [ ] \\",
  "a s d f g h j k l ; '",
  "z x c v b n m , \\. /",
]
rows_shift = [
  "~ ! @ # $ % ^ & * ( ) _ +",
  "Q W E R T Y U I O P { } |",
  "A S D F G H J K L : \"",
  "Z X C V B N M < > ?",
]

