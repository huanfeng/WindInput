[schema]
id = "pinyin"
name = "全拼"
icon_label = "拼"
version = "1.0"
author = "内置"
description = "全拼输入方案"

[engine]
type = "pinyin"

[engine.pinyin]
scheme = "full"

# 辅助码：拼音候选的字形二次筛选（笔画码，h/s/p/n/z = 横竖撇捺折）。
# 词组逐字首码匹配为固定语义（第 i 位命中第 i 字任一码的首字符；短于词字数 = 前缀态保留）。
#
# ⚠️ 本段只声明「全拼推荐哪张辅助码表」，**不代表功能开启**。
# 总开关是 config.toml 的 [schema.pinyin.aux_code].enabled（出厂 false）。
[engine.aux_code]
# "schema:<码表方案 id>" = 取该方案系统词库 + 用户词库里的编码。这里引用内置的「笔画」
# 码表方案（stroke.schema.toml，不在出厂切换列表里，但装着），它的词库与
# aux_code/stroke.txt 由同一次转换产出、码逐字相同，引用方案的好处是用户给笔画方案
# 加的字也能拿来筛。换成别的码表如 files = ["schema:wubi86"]；也可写码表文件路径
# （相对 schemas 目录，如 "aux_code/stroke.txt"，旧写法继续有效）。
# 两种来源的数据都由构建脚本从上游拉取并转换，不入版本库（见 NOTICE.md）。
files = ["schema:stroke"]

# ★ 全拼出厂**不设**辅助码触发键，且这不是「暂时没配」——是键位预算不够。
#
# 全拼的音节边界必须靠符号键表达：出厂 schema.pinyin.separator = "auto"，而 `'`
# 已被 select_key_groups 占作选词键，于是 pinyin_separator_key 判定**反引号即音节
# 分隔符**。按键分派里分隔符臂位于 [key_actions] 裁决之前（message_handler.rs 的
# VK_QUOTE|VK_BACKTICK 臂 vs 兜底臂中的 D0），所以哪怕在 schema_overrides 里写了
# backtick = "aux_code"，那个键也永远走不到辅助码——enter_aux_code 的门卫会为此
# 打一条 warn，不再静默失效。
#
# 双拼没有这个问题：pinyin_separator_key 对双拼恒早退（buffer 会与 preedit 发散），
# 反引号是自由键。这就是两个方案必须能分别开关的根本原因。
#
# 全拼要用辅助码，需在 schema_overrides/pinyin.toml 里改绑一个未被占用的键，例如：
#     [engine.aux_code]
#     enabled = true
#     [key_actions]
#     backslash = "aux_code"

[[dictionaries]]
id = "pinyin_main"
path = "pinyin/rime_frost.dict.yaml"
type = "rime_pinyin"
default = true
base_order = 0

# 扩展词库（细胞词库）发现目录：把 rime 拼音词库（*.dict.yaml）放进用户目录的
# schemas/pinyin/cn_dicts_cell/，它就出现在「方案设置 → 扩展词库」里（出厂不勾选），
# 不用改本文件。目录名与 rime-frost 一致，上游那个目录可以整个拷过来。
# 已被上面主库 import_tables 引用的文件不重复登记。
[[dictionary_dirs]]
path = "pinyin/cn_dicts_cell"
type = "rime_pinyin"

# 权重不归一化——这是刻意的，勿加 [weight_spec]：
#   1. 拼音权重刻意在与码表不同的轴上（max 1537 万），其与码表的先后由协调器
#      source_tier 的档位隔离决定，不靠比 weight；
#   2. pinyin/mod.rs 的 COMPLETION_FAR_WEIGHT_FLOOR(100) 与
#      SENTENCE_YIELD_WEIGHT_FLOOR(50) 是**按原始权重分布标定的绝对阈值**（该处
#      代码注释亦有明示）。拼音 p50 仅 20，归一化后人人过线，两道闸门会静默失效。
# 本库分布（供设计者查阅）：median≈200 max≈1926 万 —— 亦是上述 FLOOR 取值的依据。

