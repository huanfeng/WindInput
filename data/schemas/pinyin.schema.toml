[schema]
id = "pinyin"
name = "全拼"
icon_label = "拼"
version = "1.0"
author = "内置"
description = "全拼输入方案"

[engine]
type = "pinyin"

[engine.pinyin]
scheme = "full"

# 辅助码：拼音候选的字形二次筛选（笔画码，由 rime-stroke 笔画表按常用字集转换）。
# 文件由构建脚本从上游拉取并转换，不入版本库（见 NOTICE.md）。
# 词组逐字首码匹配：第 i 位命中第 i 字任一码的首字符；输入短于词字数 = 前缀态保留。
# 总开关是 config.toml 的 [schema.pinyin.aux_code].enabled（出厂 false）。
[engine.aux_code]
files = ["aux_code/stroke.txt"]

# 全拼出厂**不设**辅助码触发键——auto 模式下反引号被占作音节分隔符
# （VK_QUOTE|VK_BACKTICK 臂优先于 [key_actions] 分派），无法到达 aux_code。
# 要启用需在 schema_overrides/pinyin.toml 里改绑未占用键，例如：
#     [engine.aux_code]
#     enabled = true
#     [key_actions]
#     backslash = "aux_code"

[[dictionaries]]
id = "pinyin_main"
path = "pinyin/rime_frost.dict.yaml"
type = "rime_pinyin"
default = true
base_order = 0

# 权重不归一化——这是刻意的，勿加 [weight_spec]：
#   1. 拼音权重刻意在与码表不同的轴上（max 1537 万），其与码表的先后由协调器
#      source_tier 的档位隔离决定，不靠比 weight；
#   2. pinyin/mod.rs 的 COMPLETION_FAR_WEIGHT_FLOOR(100) 与
#      SENTENCE_YIELD_WEIGHT_FLOOR(50) 是**按原始权重分布标定的绝对阈值**（该处
#      代码注释亦有明示）。拼音 p50 仅 20，归一化后人人过线，两道闸门会静默失效。
# 本库分布（供设计者查阅）：median≈200 max≈1926 万 —— 亦是上述 FLOOR 取值的依据。

