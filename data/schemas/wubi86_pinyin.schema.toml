[schema]
id = "wubi86_pinyin"
name = "五笔拼音"
icon_label = "中"
version = "1.0"
author = "内置"
description = "五笔86+拼音混合输入方案"

[engine]
type = "mixed"

# 仅引擎固定参数（方案构成）；融合策略已上移至全局 [schema.mix]。
[engine.mixed]
primary_schema = "wubi86"
secondary_schema = "pinyin"

# 用户数据按候选来源归属：
#   用户词 / 临时词 / 词频 → 码表候选归主方案 (wubi86)，拼音候选归拼音 (pinyin)，英文归 english
#   候选调整（置顶 / 按编码隐藏）→ 本方案自己 (wubi86_pinyin)；
#   拼音候选的多字词删除按文字屏蔽，与拼音方案共用 (pinyin)
# 调频/造词走子方案的全局 [schema.codetable] / [schema.pinyin] 配置。
