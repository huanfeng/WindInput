[schema]
id = "shuangpin"
name = "双拼"
icon_label = "双"
version = "1.0"
author = "内置"
description = "双拼输入方案"

[engine]
type = "pinyin"

[engine.pinyin]
scheme = "shuangpin"

[engine.pinyin.shuangpin]
layout = "xiaohe"

# 辅助码：拼音候选的字形二次筛选（小鹤拆分码）。
# 词组逐字首码匹配：第 i 位命中第 i 字任一码的首字符；输入短于词字数 = 前缀态保留。
# 行为字段（enabled / max_phrase_len）留空回落全局，见 schema-config-layering.md §4。
[engine.aux_code]
files = ["aux_code/flypy_full.txt"]

# 反引号进辅助码（组码中有效；空缓冲时落普通标点）。绑定本身不激活功能：
# enabled = false 时门卫拒绝进入，该键照常落普通标点。
[key_actions]
backtick = "aux_code"

[[dictionaries]]
id = "pinyin_main"
path = "pinyin/rime_frost.dict.yaml"
type = "rime_pinyin"
default = true
base_order = 0

# 权重不归一化——这是刻意的，勿加 [weight_spec]：
#   1. 拼音权重刻意在与码表不同的轴上（max 1537 万），其与码表的先后由协调器
#      source_tier 的档位隔离决定，不靠比 weight；
#   2. pinyin/mod.rs 的 COMPLETION_FAR_WEIGHT_FLOOR(100) 与
#      SENTENCE_YIELD_WEIGHT_FLOOR(50) 是**按原始权重分布标定的绝对阈值**（该处
#      代码注释亦有明示）。拼音 p50 仅 20，归一化后人人过线，两道闸门会静默失效。
# 本库分布（供设计者查阅）：median≈200 max≈1926 万 —— 亦是上述 FLOOR 取值的依据。
