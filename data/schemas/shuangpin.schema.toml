[schema]
id = "shuangpin"
name = "双拼"
icon_label = "双"
version = "1.0"
author = "内置"
description = "双拼输入方案"

[engine]
type = "pinyin"

[engine.pinyin]
scheme = "shuangpin"

[engine.pinyin.shuangpin]
layout = "xiaohe"

# 辅助码：拼音候选的字形二次筛选（小鹤拆分码）。路径相对 schemas 目录。
# 词组逐字首码匹配为固定语义（第 i 位命中第 i 字任一码的首字符；短于词字数 = 前缀态保留）。
#
# ⚠️ 本段只声明「双拼推荐哪张辅助码表」，**不代表功能开启**。
# 总开关是 config.toml 的 [schema.pinyin.aux_code].enabled（出厂 false）；
# 用户要单独在双拼开启，写 %APPDATA%\WindInput\schema_overrides\shuangpin.toml：
#     [engine.aux_code]
#     enabled = true
# 行为字段（enabled / max_phrase_len / direct）在此留空 = 回落全局，见 schema-config-layering.md §4。
#
# 直接辅助码（不按引导键，末 1～2 位自动当辅码：uidu + p → 「释读」）同样出厂关，开启写：
#     [engine.aux_code]
#     enabled = true
#     direct = true
# 引导键（下方反引号）与直接辅助码并存：直接辅助的结果上仍可按反引号进筛选。
[engine.aux_code]
# files 也可写 "schema:<码表方案 id>"，取该方案系统词库 + 用户词库里的编码，如
# files = ["schema:wubi86"]。
files = ["aux_code/flypy_full.txt"]

# 反引号进辅助码（组码中有效；空缓冲时落普通标点）。覆盖全局 backtick = "temp_pinyin"
# 的默认绑定——temp_pinyin_target 对拼音方案本就不成立，反引号在此是自由键。
# 绑定本身不激活功能：enabled = false 时门卫拒绝进入，该键照常落普通标点。
#
# 分隔符臂在按键裁决里排在 key_actions 之前，本可以把这个键夺走（双拼已支持手动分隔符，
# 见 docs/design/shuangpin-separator.md）。夺不走是因为 separator 的 auto 模式会**避让
# 本段已绑的键**：双拼下 `'` 被选词键占、反引号被这里占，auto 于是两个都不选。
# 想在双拼用分隔符，显式写上方 [engine.pinyin] separator = "quote"（那时反引号仍归辅助码）。
[key_actions]
backtick = "aux_code"

[[dictionaries]]
id = "pinyin_main"
path = "pinyin/rime_frost.dict.yaml"
type = "rime_pinyin"
default = true
base_order = 0

# 扩展词库（细胞词库）：放在主词库所在目录的 ext/ 下（schemas/pinyin/ext/），引擎自动识别、
# 出现在「方案设置 → 扩展词库」里（出厂不勾选），不用在这里声明（拼音 / 码表方案没写
# [[dictionary_dirs]] 时都兜底这个目录）。下面逐张登记的是随包附带的 16 张——rime-frost
# cn_dicts_cell 里体积小、开了对主库排序几乎无影响的那些——只为给出中文名称。
# 大库（composite / food / game / medication 等）不随包，用户自己放进 ext/ 即可，
# 取舍见 docs/design/schema-dict-discovery.md §8。文件清单与 scripts/dev.sh 的 FROST_CELLS 同步。
[[dictionaries]]
id = "cell_exthot"
label = "网络热词"
description = "近年流行语与网络热词"
path = "pinyin/ext/exthot.dict.yaml"
type = "rime_pinyin"
base_order = 1

