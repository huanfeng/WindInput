# WindInput 系统短语
# 随程序打包发布，用户不应直接修改此文件
# 文本中的 $变量 会在运行时自动展开（$var / ${var}，$$ 转义为 $）
#
# weight: 0~10000 短语 tier 内排序权重，未设置默认 1000（中位）
# position: 仅同 code 多条 tie-break（升序）
# platform: ""/"all"=全平台；"windows"/"macos"/"linux"/"android"=仅该平台（"darwin" 是 "macos" 的旧写法）；
#   "desktop"=三种电脑（windows/macos/linux），手机上没有——打开网页、模拟按键、读写剪贴板这类
#   手机上执行不了的条目写它，不必复制三份。
#   按运行平台取舍：同一个 code 要在各平台做不同的事（路径、程序名不同），就每个平台各写一条。
# enabled: 出厂是否启用，缺省开。少数人用、编码又容易和码表撞的写 false（如时间戳 tmts），
#   照样出现在短语管理里，用户自己打开即可；「恢复默认」回到这里的值。
# 详见 docs/design/command-bar-design.md

[[phrases]]
code = 'date'
text = '$Y年$M月$D日'
weight = 1000
position = 1

[[phrases]]
code = 'date'
text = '$Y-$MM-$DD'
weight = 800
position = 2

[[phrases]]
code = 'date'
text = '$Y.$MM.$DD'
weight = 800
position = 3

[[phrases]]
code = 'date'
text = '$Y/$MM/$DD'
weight = 800
position = 4

[[phrases]]
code = 'date'
text = '${YC}年${MC}月${DC}日'
weight = 800
position = 5

# 农历补两条，weight 低于全部公历形态故恒排其后。$LF 在非节日展开为空，
# 于是同一条模板平常日子给「农历四月廿九」、端午当天给「农历五月初五端午节」。
# 农历大全见 zznl。
[[phrases]]
code = 'date'
text = '农历$LMD$LF'
weight = 600
position = 6

[[phrases]]
code = 'date'
text = '$LY$LZ年$LMD$LF'
weight = 600
position = 7

