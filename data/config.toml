# WindInput 系统预置配置（键名 6 域重命名后，见 docs/config-key-migration.md）
# 此文件为应用内置默认配置，随程序安装包分发。
# 加载优先级：代码默认值（Layer 1）→ 本文件（Layer 2）→ 用户配置
# （%APPDATA%\WindInput\config.toml，Layer 3）。
# 修改此文件可调整新安装或新版本升级后的默认行为，无需重新编译。
#
# ── 本文件的契约 ────────────────────────────────────────────────────────────
# 1. **完整**：`config_schema.rs` 的 REGISTRY 里每一个键都必须在此显式列出，
#    使本文件同时是「出厂默认值」与「全部可配置项的说明书」。
#    仅两个实例集合键刻意不写（见下方 [schema] 段说明），已在测试中登记豁免。
#    守护测试：`data_config_toml_covers_registry`（缺键即失败）、
#    `data_config_toml_has_no_orphan_keys`（多键即失败）。
# 2. **新增配置项需四处同步**：`config.rs` 结构体字段 + `Default` 初值 →
#    `config_schema.rs` 的 REGISTRY → 本文件。漏掉本文件时上面第一个测试会失败。
# 3. **数组是整体覆盖，不是合并**：本文件写出的数组会**整体替换**代码默认值，
#    而非并集。故此处漏写一个元素 = 该元素在成品里不存在。改数组类键前请先比对
#    `config.rs` 的 `default_*()` 函数。
#
# 注意：本文件不写 version 键——version 是用户文件的迁移状态锚点。

[schema]
active = "wubi86"
available = ["wubi86", "wubi86_pinyin"]
# 主码表方案 ID（拼音反查码源），留空时按 available 顺序自动选第一个码表方案
primary_codetable = ""
# 主拼音方案 ID（临时拼音的目标方案，如双拼方案 id），留空 = 全拼 "pinyin"
primary_pinyin = ""

# ── 刻意不在本文件出现的一个键（实例集合，注册表类型 StructList）────────────
# schema.mix_modes      临时融合模式列表（代码默认 = 内置「快捷」quick_mix，`;` 触发，
#                       成员 quick_input.calc/.number/.date/.repeat + $primary_pinyin + english）
#
# 它是**结构体数组**，本文件一旦写出就会整体替换代码默认值，把当时的定义**冻结**
# 成快照——日后在 `default_mix_modes()` 里给内置「快捷」加成员或改触发键，全部会被
# 这份陈旧快照静默遮蔽。故真相源留在代码侧，本文件不写。
# 它已在 `data_config_toml_covers_registry` 的豁免名单中登记。
#
# 原先并列的 `schema.special_modes` 已**删除**：特殊模式（快符/生僻字等）的实例集合
# 改由「带 [overlay] 段的已安装方案」定义，呈现配置写在方案文件的 [overlay] 段，
# 引导键与直达热键写在下方 [keys.key_actions]（如 backslash = "special:<方案id>"）。
# 见 docs/redesign/overlay-mode-config.md。

# 全局码表配置：所有码表方案公共基线（出厂取主力码表 wubi86 偏好）。
# 方案个性覆盖：在方案 .schema.toml 的 [engine.codetable] 内联行为字段（作者基线），或
# %APPDATA%/WindInput/schema_overrides/{id}.toml 同名的 [engine.codetable] 段（设置页写入，深合并覆盖）；
# 二者段名/字段与本节一致，字段存在即覆盖、缺省即回落本节。
[schema.codetable]
top_code_commit = true
clear_on_empty_max = false
auto_commit_at_full = false
# 自动上屏的最短码长（0 = 等于该方案全码长）。隐藏参数，设置页不暴露。
auto_commit_min_len = 0
punct_commit = true
show_code_hint = true
single_code_input = false
single_code_complete = true
# 出简让全：有简码的字，在更长的码位上把首选让给词语。
# 「路」的三简是 kht，用户已能 3 键打出它，那么 khtk 的首选就给「路上」之类。
# 值 = 参与让位的简码级别上限：0 关闭 / 2 一二级简码置后 / 3 全部简码置后。
# 出厂关：「短码首选就是简码」只对五笔这类前缀式简码成立，而这里是所有码表方案的公共
# 基线——按频次排序的码表若跟着让位，沉底的正是作者排在前面的常用字。要用请自己开。
# 单个方案也可在自己的 .schema.toml 的 [engine.codetable] 里声明，覆盖此处。
short_code_yield_level = 0
z_key_repeat = true
# z 键功能：空缓冲按 z、且 z 在本方案是死码（无以 z 开头的编码）时，进哪个模式。
# 值域：""/none（作正常编码字母）/ temp_pinyin / temp_english / mix:<id> / special:<id>。
# 与 z_key_repeat 正交：repeat 先手，继续打字母才轮到本项。
# 出厂空 = 不启用；这是**方案级**配置，按码表在自己的 [engine.codetable] 里开。
z_key_action = ""

# 码元字符集：哪些字符可以进输入缓冲（决定一次按键是打码还是作标点/选词/透传）。
# 格式为「范围 + 字面」，如 a-x（五笔标准）、a-x/（词库含 /test 这类词条）、a-z0-9（要打 Win10）。
# `-` 写在首位或末位时作字面。大小写不敏感。出厂空 = 内置默认 a-z。
# 这是**方案级**配置，按码表在自己的 [engine.codetable] 里写；此处是全局基线。
input_chars = ""
# 可作**首码**的字符集（input_chars 的子集）。空 = 与 input_chars 相同。
# 典型用途：数字要能作码元（打得出 Win10）但不能起头——空缓冲下的数字键是选词/透传，
# 若它同时是首码，就再也选不了「第 1 个候选」，也拿不回原生数字输入。
# 故要数字作码元时，配 input_chars = "a-z0-9" 与 leading_chars = "a-z"。
leading_chars = ""

# 码表调频（全局唯一；strategy: top=一次到顶 MRU / step=逐次提升）。
#
# 首选保护按**输入码长分级**（见 docs/design/codetable-freq-short-code-protection.md）：
# 词库靠权重表达简码的钦定地位（gen_dict 给一简 9999 / 二简 9950 / 三简 9000），但调频重排
# 的比较链**不含 weight**，只看「有没有被选过」。五笔一简 25 个码每个都是二选一
# （a → 工 9999 / 戈 9998），次选字被误选一次就永久翻转。故简码位保住首选、全码位放开。
[schema.codetable.frequency]
enabled = false
# 兜底档：码长 ≥ 4 的深码位。0 = 不保护——那里正是调频该起作用的地方。
protect_top_n = 0
# 一简位（码长 1）：保护词库钦定首选。
protect_top_n_len1 = 1
# 二简位（码长 2）。
protect_top_n_len2 = 1
# 三简位（码长 3）：默认不保护，其钦定性弱于一二简。
protect_top_n_len3 = 0
strategy = "top"
# 前缀补全候选参与位置提升的范围：none | single | all（默认 all）。
# **仅 strategy = "position" 时生效**；top/step 走布尔 used-first，不读本项。
# 码表默认 all 而拼音默认 single：码表的前缀补全已由来源档位隔离、跨不到精确档之前，
# 无需再按语义单元收窄，且与 top/step 的历史行为一致。
promote_prefix = "all"
# 衰减半衰期（小时）：调频热度衰减到一半所需时间。**仅 strategy = "position" 时生效**。
# 0 = 用内置默认 72 小时。**与 schema.pinyin.frequency.half_life 完全独立，不回落到它**
# ——设置页上这是两个独立控件，回落链会让用户「码表的留在 0、改了拼音的、码表跟着变」。
half_life = 0.0

# 码表自动造词（连续单字）：连续单字上屏累积成序列，遇终止符（标点/回车/空格/焦点切换/
# 光标移动/多字词上屏）或空闲超时后，按方案 [[encoder.rules]] 为整串算词组编码写入**临时
# 词库**（立即可选），累计用满 promote_count 次才晋升进用户词库。
[schema.codetable.auto_phrase]
enabled = false
# 造词最小字数。内部字段，设置页不暴露。
min_phrase_len = 2
# 造词最大字数。**超长序列整体放弃**，不截末尾 N 字——在连续多字中间切一刀，切出来的
# 多半不是词，是杂词的主要来源。内部字段，设置页不暴露。
max_phrase_len = 5
# 临时词晋升进用户词库所需的使用次数。0 = 不晋升，一直留在临时词库。
promote_count = 0
# 连续单字之间的最大间隔（毫秒，0 = 用内置 5000）。超时则视作序列终止。
# 兜底用：终止信号全漏时防止跨句拼出「加好加好」这类杂词。内部字段，设置页不暴露。
idle_timeout_ms = 0
# 临时词库条目上限（0 = 不限）。超出后淘汰权重最低者。内部字段，设置页不暴露。
temp_max_entries = 5000

# 全局拼音配置：所有拼音类方案（全拼/双拼/混输拼音子方案/临时拼音反查）共用一份。
[schema.pinyin]
show_code_hint = true
use_smart_compose = true
# 手动音节分隔符策略。auto = 动态避让选词键（' 被占作选词键时改用反引号，反之用 '）；
# 也可显式写 quote / backtick / none。
#
# ⚠️ 这是**基线**，方案可以覆盖：在方案的 [engine.pinyin] 段（或
# %APPDATA%\WindInput\schema_overrides\<方案id>.toml）写 separator = "none" 即可。
# 需要它的典型场景是键位争用——双拼出厂把反引号给了辅助码
# （见 schemas/shuangpin.schema.toml 的 [key_actions]），而全拼的音节边界只能靠符号键
# 表达。全局唯一的值表达不了「全拼用反引号作分隔符、双拼用反引号进辅助码」。
separator = "auto"

# 双拼相关的全局行为。与**方案级** [engine.pinyin.shuangpin]（那里放 layout＝这个方案的
# 编码规则）分工：本段是「这台机器怎么用双拼」的偏好，一次配置对所有双拼方案生效。
[schema.pinyin.shuangpin]
# 双拼方案下额外把击键当全拼再解释一遍（多人共用一台机器：主力打双拼，别人只会全拼）。
# 只有**低置信**的全拼候选（前缀补全 / 子短语）沉底；精确整词与整句和双拼候选同层竞争，
# 由消费长度决定先后。同一个词双拼也打得出时，留下的是双拼那条。
# 非双拼方案下本项无效；混输的拼音次引擎强制关闭。
allow_full_pinyin = false

# 辅助码：在拼音候选上再按**字形**筛一轮（打「时间」的拼音，再敲 om 只留字形对得上的）。
# 方案级 [engine.aux_code] 声明「这个方案用哪张码表」（全拼笔画 / 双拼小鹤形码），
# 本段是行为基线；方案可用同名段的 enabled / max_phrase_len 逐字段覆盖（tri-state，
# 缺省即回落本节），与 [schema.codetable] 那套一致，见 schema-config-layering.md §4。
[schema.pinyin.aux_code]
# 总开关。★ 出厂 false：辅助码会改变一个已有按键的语义（双拼下反引号从标点变成进入
# 筛选模式），并把数万条码表读进内存——两件事都不该在用户没表态时发生。
#
# ⚠️ 全拼与双拼要分别开关，不能只靠本项：全拼的反引号出厂已被音节分隔符占用
# （separator = "auto" 且 ' 作选词键），绑了也进不去。故常见配置是「只在双拼开」——
# 写 %APPDATA%\WindInput\schema_overrides\shuangpin.toml：
#     [engine.aux_code]
#     enabled = true
enabled = false
# 词组长度上限：字数 > 此值的词组一律排除、不参与筛选（0 = 不限）。单字恒参与。
# 长词组（整词补全，如 meishijian 下的「没时间看/没时间做」）靠首字前缀会大量残留、
# 污染逐字词筛选；设成 4 之类可把它们挡在筛选之外。
max_phrase_len = 0

# 模糊音：enabled 是总开关，下面每项各自控制一组等价音（默认全关，逐项按需开启）。
[schema.pinyin.fuzzy]
enabled = false
# 声母组
zh_z = false
ch_c = false
sh_s = false
n_l = false
f_h = false
r_l = false
# 韵母组（前后鼻音）
an_ang = false
en_eng = false
in_ing = false
ian_iang = false
uan_uang = false

# 拼音调频（衰减参数；三个数值 0 = 用词频 store 的内置默认）。
[schema.pinyin.frequency]
enabled = true
# 半衰期（小时）：词频热度衰减到一半所需时间。
half_life = 0.0
# base 系数与最近使用峰值：**当前模型不使用**，改动无效果。
# 拼音词频已改为位置提升模型（按候选位次前移，不打分），只有 half_life 仍生效。
# 保留这两项是为了将来若恢复打分模型可直接复用，见 docs/design/freq-rerank-model.md。
base_scale = 0.0
recency_peak = 0.0
# 前缀补全候选参与词频位置提升的范围：none | single | all（默认 single）。
#   none   —— 前缀补全一律不提升
#   single —— 只提升「单个语义单元」的候选：中文单字、西文单词（如 hello）
#   all    —— 全部提升
# 判据是语义单元数而非字符数：英文所有候选都是前缀匹配（打 hel 出 hello），
# 按字符数会把英文调频整个挡死。「东西」「thank you」都是 2 个单元，不提升。
promote_prefix = "single"

# 词组补全的音节数约束。约束的是「码比输入长」的补全词——即引擎在预测你还没打的音节。
# 精确匹配、子短语、整句、简拼都不受影响（它们不预测任何东西）。
#
# 尺子是「输入自身的音节数」= 完整音节数 + (有尾部残码 ? 1 : 0)。`dianh` = dian + 残码 h
# 算 2 个音节，故它照常出「电话」；而 `dian` / `xia` / `d` 都只算 1 个。
[schema.pinyin.completion]
# 至少输入几个音节才给出词组候选。
# 4 = 出厂值，与 librime（kNumSyllablesToPredictWord）、fcitx5（LongWordLengthLimit）一致：
#     打到第 4 个音节才开始预测你没输入的内容，前 3 个音节只给音节数对齐的候选。
# 2 = 0.x~1.x 的旧出厂值（`zaim` 会混进 3 音节的「在美国」）。
# 1 = 不设限，回到 0.x 更早的行为（单字母就混进「但是」「的时候」）。
min_syllables = 4
# 词组最多比输入多几个音节。数值越大，引擎越敢预测你还没打的内容。
# 0 = 只给音节数与输入相等的词；
# 1 = 只补下一个音节（`nih` 出「你好」「你会」，不出 4 音节的「你会发现」）；
# 5 = 出厂值，与 min_syllables=4 配合，`started=4` 时上限 4+5=9 音节，够「冰冻三尺非
#     一日之寒」这类长成语在打到第 4 个音节时就召回；
# 4 以上才够 `zhonghuar`（3 音节）补出 7 音节的「中华人民共和国」——注意 min_syllables=4
#     下 `zhonghuar` 只算 3 个音节，本就不预测，要打到第 4 个音节才轮到本项生效。
#
# ⚠️ 两个旋钮要配合调：上限 = started < min_syllables ? started : started + max_extra。
# 单独调大 min_syllables 而不动本项，长词要到更晚才召回；单独调大本项，前几个音节
# 仍然完全不预测（被 min_syllables 卡住），改了也看不出变化。
max_extra_syllables = 5

# 上下文语言模型（n-gram）。
# ⚠️ 实验性，尚未正式发布：默认关闭，且不随安装包提供模型文件。
# 设计、实测与开启方式见 docs/design/language-model-integration.md。

[schema.pinyin.grammar]
# 0 = 关闭（默认）。关闭时不读模型文件、不占内存，整句结果与没有该功能时逐位相同。
weight = 0.0
# 模型文件名，相对 data/schemas/pinyin/grammar/。**空串（默认）= 不启用**。
# weight 与 model 两个都要显式配置才生效——只调 weight 不会静默启用某个默认模型。
# 模型需自行获取，不随安装包分发（许可与体积，见设计文档 §5、§8）。
model = ""

# 拼音自动造词。

[schema.pinyin.auto_learn]
enabled = true
# 造词最小字数（0 = 用内置 2）。
min_word_length = 0
# 造词最大字数（0 = 不限）。超出后先从尾部保留整段裁剪，仍超则整体放弃。
# 整句一次上屏时只有一段可裁，故对整句等价于「超过就不学」。
max_word_length = 10
# 临时词晋升进用户词库所需的使用次数（0 = 用内置默认）。
promote_count = 0

# 全局英文配置：英文方案自身的行为。它独立于码表段——否则纯码表用户的「上屏行为」里
# 会混进只对英文生效的项，而英文用户改调频会连带改掉五笔的。
#
# ★ 本段**同时管辖临时英文**（Shift+字母进入的那个 overlay）：两者打的是同一份英文词库、
#   同一个方案 id，故调频与补空格是同一套配置、同一份学习数据——临英里选过的词，切到
#   英文方案照样排在前面，反之亦然。差别只在进入方式与少数按键语义，后者在
#   [input.temp_english] 段。
[schema.english]
# 英文方案下上屏一个词后再补一个空格。英文是词间带空格的语言，连打时每次上屏都要多按一次。
# 覆盖所有选中方式（空格/数字键/次三选键/鼠标）与「空格上屏原码」；回车上屏原码不补。
commit_space = false
# raw_candidate：首候选恒是所打原文。
#   英文的特殊性是「输入即内容」——输入串本身就是可上屏文本。调频一旦把某个词顶到首位，
#   想上屏原文就只剩回车，而回车是终结性动作、会打断连续输入。开着它，空格永远上屏原文，
#   词库词往后挪一位。关掉则总是走词库补全（打词库里没有的词时按回车上屏）。
#   ⚠️ 与下面的 case_variants 同时关闭且词库无命中时，候选会是空的——此时空格上屏输入串。
raw_candidate = true
# case_variants：大小写变形候选（全小写/首字母大写/全大写）。
#   ★ 与 [input.temp_english] 那份同名项**默认相反**（那边是 true），刻意如此：
#   临英是「中文里插一个英文词」，人名与专有名词要首字母大写是刚需；英文方案是长时打英文，
#   每条变形吃一个候选位，每页 5 条时吃掉一半。两个作用域各配各的。
case_variants = false

# 英文调频。**没有 protect_top_n***：那组是「简码位首选保护」，判据是本次输入的码长，
# 而英文没有简码位——一个 a 后面跟的是几万个词而不是钦定首选，照搬只会锁死前几位。
[schema.english.frequency]
enabled = false
# top（一次到顶 MRU）/ step（逐次提升）/ position（位次渐进）。
# **默认与码表不同**：英文候选几乎全是前缀匹配，top/step 那种「用过一次即整体跳到没用过
# 的那批之前」过于激进，误选一次就把词顶到很显眼的位置且不衰减。position 每次只前移
# 一半、久不用会回落，更适合前缀为主的场景。
strategy = "position"
# 前缀补全候选参与位置提升的范围：none | single | all。**仅 position 生效**。
# 英文默认 all——它的候选本来就几乎全是前缀补全（打 hel 出 hello），收窄等于关掉大半。
promote_prefix = "all"
# 衰减半衰期（小时），0 = 内置默认 72 小时；仅 position 生效。与码表/拼音各自独立。
half_life = 0.0
# 词频记账码口径：candidate | input（默认 candidate）。原 codetable.frequency.english_code_scope。
#   candidate —— 打 hel 选 hello 记成 (hello, hello)，之后打 he 也受益（跨码位共享）
#   input     —— 记成 (hel, hello)，各前缀独立学习（与码表同侧）
# ⚠️ 本项按**候选来源**生效而非按当前方案：混输方案里混进来的英文候选同样读它。
code_scope = "candidate"

# 全局混输配置（融合策略；全局唯一，无方案级 override）。
[schema.mix]
show_source_hint = false
enable_english = false
pinyin_only_overflow = true
top_code_override_pinyin = false
# 满码自动上屏**与顶码上屏**遇拼音候选则否决（粗粒度：整串只要查得出拼音候选就让路拼音，
# 不看拼音成不成词）。与下方细粒度的 block_commit_on_pinyin_word 叠加，任一命中即否决。
# 注意它同时管顶码上屏，而 schema.codetable.top_code_commit 出厂即开；
# top_code_override_pinyin 可无视本否决强制倒向码表。
# 例外：顶码上屏时若「归属已判给码表」（前 N 码是精确全码 + 拼音/英文都主张不了整串），
# 本项不再否决——让路的前提是拼音接得住这一串。如 cety（唯一全码「通往」）再打第 5 键，
# ce 是完整音节但 ty 不成音节，拼音只解释 2/5 键 ⇒ 照常顶码上屏「通往」。
# ⚠️ 该例外在 enable_pinyin_abbrev 打开时失效（出厂已关），见下方该项说明。
# 它还是**满码空码清空**（schema.codetable.clear_on_empty_max）的总闸：开着时「已有拼音候选」
# 或「拼音还没打完」都会拦下清空；关掉则拼音不再干预，满码只剩「部分匹配」的拼音候选时即清空
# （如 nunl：候选「嫩」只解释了前 3 码 nun）。仍在打的词不受影响——wanl 有前缀补全候选
# （wanle→完了，消费整串）照常拦住清空。
auto_commit_block_on_pinyin = true
# 满码上屏遇英文候选则否决（保护正在输入英文词的用户；仅 enable_english 开时有意义）。
auto_commit_block_on_english = false
min_pinyin_length = 2
# 英文最小触发长度（2 字符以内不查英文；0=回退 3）。
min_english_length = 3
# 拼音歧义拦截（词强度）：整串是强拼音词时否决五笔自动/顶码上屏，让拼音赢
# （wangba→网吧 拦；aipu→落实 无强词放行）。独立于 auto_commit_block_on_pinyin。
block_commit_on_pinyin_word = true
# 词强度权重阈值（0=仅结构判据：拼音首选须≥2汉字且消费整串；预留真机调）。
pinyin_word_min_weight = 0
# 混输时拼音是否产出简拼候选（声母缩写，nh→你好）。关闭后混输的拼音只认全拼，
# 适合「只把拼音当临时输入补位」的用户——简拼会让几乎任何字母串都可能是拼音。
# 仅影响混输的拼音子引擎，纯拼音方案不受影响。
# ⚠️ 出厂**关**，因为开着它时**超码长的顶码上屏基本不会发生**：简拼整句候选会「消费整串」，
# 于是超码长归属恒判给拼音（pinyin_only_overflow 独立拦下顶码，与上面那两个否决开关无关、
# 也关不掉——它在设置页是隐藏项）。混输用户以码表为主，默认让顶码可用。
# 不把简拼改成「不算主张整串」是有意取舍：那样长简拼词（zgrmghg 之类）会被前 4 码的五笔
# 全码顶码截胡。需要简拼打长词的用户显式打开本项，代价是失去超码长顶码上屏。
enable_pinyin_abbrev = false
# 码长内（输入不超过主码表码长）是否保留「未消费整串」的拼音候选。
# 关（默认）：gedw（五笔精确码「青春」）不再列出 ge 的两百多条同音单字——它们每条只解释了
# 4 键中的 2 键。开着简拼时，混合简拼词「各单位」也因此能排到前面。
# 代价：码长内没有分步上屏（选一条部分候选先上屏、剩余码接着打）。
# 正在输入中的拼音不受影响：wanl→「完了」是前缀补全（码 wanle，消费整串），照常出候选。
pinyin_partial_candidates = false
# 超码长（输入已超过主码表码长、切入纯拼音语境）是否保留同类候选。
# 开（默认）：长拼音是拼音的地盘，nihaom 选「你好」再续打 ma 的分步上屏要留着。
pinyin_partial_candidates_overflow = true

[schema.quick_input]
# 注：; 由内置 mix「快捷」融合接管。各候选来源（计算 / 日期 / 数字金额 / 重复上屏 /
# 拼音 / 英文）是该 mix 的 members 成员——开关即增删、优先级即顺序，真相源在代码侧的
# default_mix_modes()，本文件不写 mix_modes（写了会把定义冻结成快照，见文件头说明）。
# 本段只留与来源无关的全局项——没有总开关，禁用＝把 quick_mix 的 trigger_keys 清空。
#
# 「强制竖排」原是本段的 force_vertical，现已迁往 mix_modes[].candidate_layout ——
# 它的判定条件本就是「**这个 mix 实例**含 quick 成员」，属于实例的显示属性。
# 内置 quick_mix 出厂即 "vertical"，默认值在代码侧 default_mix_modes()（本文件不写
# mix_modes，写了会把整份定义冻结成快照，见文件头说明）。存量 force_vertical 在加载期
# 自动迁移：true → "vertical"，false → "follow"（不是 horizontal——false 的语义是「不强制」）。
decimal_places = 6

# 跨引擎的词频公共基线。
# 与 [schema.codetable.frequency] / [schema.pinyin.frequency] / [schema.english.frequency]
# 分工：那三段是**各引擎自己**的调频参数（策略、保护位数、半衰期），值可以互不相同；
# 本段是**三个引擎都照办的同一条规则**。判据＝用户会不会想给不同引擎配不同的值。
#
# ⚠️ 本段**没有方案级形态**：方案文件里写 [frequency] 不会被读取。
# 与它只差一层的 [schema.codetable.frequency] 恰恰是可以被方案覆盖的（方案里写
# [codetable.frequency] 有效），故此处点明，免得照着那个类推。全局唯一正是本段的定义
# ——「三个引擎都照办的同一条规则」，让方案改掉它就自相矛盾了。
[schema.frequency]
# 这些 Unicode 区块的候选不参与词频：既不记录选中（不学习），也不受已有记录影响（不重排）。
# 取值为区块名或预设组名，两种写法都收：
#   预设组   emoji             —— 跨 5 个区块（表情符号 / 杂项符号 / 装饰符号 /
#                                 杂项技术符号 / 区域指示符），只写「表情符号」会漏掉
#                                 ⚽ ✅ ⌚ 🇨🇳 这些不在那一块里的
#   预设组   符号              —— 标点、数学、箭头、图形、带圈数字、全角形式等；
#                                 与 emoji 组刻意不重叠，两个都想排除就都写上
#   区块名   表情符号、注音符号、平假名、带圈字母数字 …… 名字见候选右键的「类型」列
# 拼错的名字会在启动日志里 warn 并跳过，不影响同一份列表里的其余项。
#
# 出厂为空 = 与不配置本项完全一致。典型用法 exclude_blocks = ["emoji"]：
# emoji 多是一次性点缀，让它参与调频会把常用字挤下去，而下次多半又想打回那个字。
exclude_blocks = []

[input]
filter_mode = "smart"
# 空码（打了码但一个候选都没有，多半是打错了）时，终结键怎么处置这串废码。
#   enter_behavior           回车          commit | clear
#   space_on_empty_behavior  空格          commit | clear
#   punct_on_empty_behavior  标点/符号键   commit | clear | clear_no_input
#
# 这一族其实有两根轴：「废码上不上屏」与「按下的这个键本身出不出字符」。
#   commit          废码上屏，键照常出（标点跟在废码后面）
#   clear           废码丢弃，键照常出
#   clear_no_input  废码丢弃，键也不出——整个按键当没按过（**仅标点有这一态**）
# 回车/空格的 clear 本就落在「键也不出」那一格（回车不换行、空格不插空格），所以它们
# 不需要、也不该有 clear_no_input——加了只会得到两个行为一样、用户无从分辨的选项。
# 标点的 clear 之所以照常出标点：标点是用户真正想输入的可见字符，吞掉等于吞掉用户意图。
# 想让标点也一起吞掉（拿标点当「取消这串废码」的键）就选 clear_no_input。
#
# ⚠️ 只有标点那项出厂是 clear，另两项是 commit——**刻意不一致，不是漏改**。
# 标点判错的代价不对称：一串没对应任何字的码被插进正文，往往发出去才发现、要退格删
# 好几次。回车留 commit 是为了保住一个「我就要这串原码」的出口，不至于想拿原码只能
# 去改配置。空格暂随回车（改它会命中「曾把它设成当时默认值的用户被静默改写」）。
#
# 注意 punct_on_empty_behavior 与 schema.codetable.punct_commit 是两回事：后者关掉是
# 「吞键、**保留**编码」，编码留在组合区继续输入；clear_no_input 是「吞键、**丢弃**编码」。
enter_behavior = "commit"
space_on_empty_behavior = "commit"
punct_on_empty_behavior = "clear"
numpad_behavior = "direct"
# 小键盘恒半角：开启后小键盘的 0-9 与 . + - * / 在全角态下仍输出半角，且不走中文标点与
# 自定义标点映射。与 numpad_behavior 正交（follow_main 下照常选词，只改出字）。
# 仅覆盖「单键直接上屏」的路径；临英/网址/快捷输入等先入缓冲的模式不受影响。
numpad_half_width = false
# 顶码上屏时「已确认文字」如何落到宿主（内部/实验项，设置页不暴露）：
#   direct_commit（默认）= 顶码时真提交，余码的新组合延到触发键 keyup 才开，靠隔一拍
#                          消息泵躲开 diff 合并；无下划线歧义、WPS 智能标点顶屏不清空。
#   pre_confirm         = 留在 TSF 组合态聚合，延到最终 CommitText 才真提交；diff 式宿主
#                          （终端 / Chromium）不双写，但部分宿主会给整段画下划线。
top_commit_mode = "direct_commit"

# 检索范围放宽（filter_mode = "smart" 时的增强，见 docs/design/smart-filter-scope-relax.md）
#
# 智能档会滤掉「同码位已有常用字」的生僻字，代价是唯一编码被占的字彻底打不出——如五笔
# 「桜」(sivg) 与常用「档」同码，只能整体切「全部字符」，且常忘记切回。
#
# 出路只有一条，且**完全由用户主动触发**：候选窗内翻页翻到底，再按一次向后翻页键，即把
# 被滤掉的字追加到列表末尾；本次组合结束（上屏/取消）后自动恢复。刻意不做任何自动行为
# ——「候选不足一页就自动补充」试过，平白改变了智能档的既有观感，已删除。
[input.scope_relax]
# 末页再按向后翻页键 → 临时放宽。候选不足一页时同样适用（那时只有一页，一样翻不动）。
page_end_key = true
# 放宽放出来的候选的前缀标注（空串=不标注），用于与正常候选区分。
prefix = "·"

# 联想：上屏之后按**刚上屏的内容**给候选，而不是按编码。
#
# 有两种，回答的是完全不同的问题——同样打完「中」，一个给「中国」，另一个给「国」：
#
#   词语联想(word)  上文当**前缀**，出词库里以它开头的更长的词。打完「中」给「中国」
#                   「中间」，选中只补出「国」「间」。PC 输入法说的「联想」就是这个。
#                   不含标点。
#   智能联想(smart) 上文当**上下文**，出下一个可能的词与标点。打完「你好」给「，。、？」，
#                   打完「2026」给「年月日元」。移动端刚需——软键盘上每多打一个字都很贵。
#
# ⚠️ 本段是**桌面基线**。移动端只有 kind / mode 两项取值不同，写在文件末尾的
#    [mobile.association] 里；其余七项两端一致，不重复。
[input.association]
# off（默认）/ word / smart。
#
# kind 兼任开关与类型：拆成「开关 + 类型」两个字段会立刻产生「开着但类型没配」的
# 歧义状态，而那个状态没有正确答案。
#
# 桌面默认关的理由：候选窗是浮层，联想常驻会挡正文，且会占用数字键——上屏后再按数字，
# 开着时是选联想词、关着时是打数字，对既有用户是突发的行为变化。
kind = "off"
#   one_shot（默认）= 只出一次，任何非选词动作即退出。
#   continuous      = 选中之后拿它当新上文接着给（「中」→「中国」→ 以「中国」开头的词）。
mode = "one_shot"
# 候选条数上限。各来源按下面的优先级依次取配额，取不满的名额顺延给后一个来源。
max_count = 9
# 空格是否上屏当前高亮的联想候选。主流输入法多数如此，故默认开；
# 关掉则空格照常出空格（联想窗同时收起）。
space_commits = true
# 联想态按回车：false（默认）= 收起联想窗，同时把回车**透传**给宿主（照常换行/发送）；
#                true       = 只收起联想窗，回车被吃掉，要按第二次才生效。
#
# 默认透传，是因为回车是终结性动作——按它是要发送或换行，而联想窗是输入法自己弹的、
# 用户并没有在选词。让一个「建议」吞掉一次回车，正事就被挡住了。
enter_cancels_only = false
# 联想态按退格：语义与 enter_cancels_only 完全对称，但**默认相反**（true = 只收窗、吃键）。
#
# 回车的透传是「把正事办了」，退格的透传却是**删掉刚上屏的字**——不可逆。联想窗弹出时
# 用户的手正停在刚打完的字上，误触退格若直接删字，代价远大于多按一次键。要的人可以关掉。
backspace_cancels_only = true
# 联想窗显示多少毫秒后自动隐藏；0 = 不自动隐藏。
# 联想态下候选窗几乎一直挂着，长时间停留会挡住正文。
hide_after_ms = 5000
# 联想态在编码栏显示的标识；空串 = 不显示。
# 只在「编码不嵌入宿主」时可见——嵌入模式下编码栏本身不存在。
hint = "联想输入"
# 四个来源的开关，优先级即此处的书写顺序（跨来源不比较分数，只按优先级取配额）。
#
# ⚠️ 这些开关**只在智能联想档生效**：词语联想按定义只用 prefix 一个来源，
# 在那一档下开着 punct 也不会出标点。
# ⚠️ 目前只有 prefix 与 punct 有实现，另两项开着也不会出候选（各自需要独立的数据来源）。
#    ⇒ 桌面上智能联想档目前能出的东西与词语联想档相同（punct 在桌面默认关）。
history = true   # 个人上屏历史学到的搭配（待实现）
bigram = true    # 词→后继表，离线从 n-gram 模型蒸馏（待实现）
prefix = true    # 词库里以上文为前缀的更长的词——词语联想就是它
# 标点与符号（静态规则表）。**桌面默认关**，移动端在 [mobile.association] 里开：
# 实体键盘上标点一键可达，打完一个字就弹一串标点干扰远大于收益；软键盘上则要切键盘层，
# 从候选里点走省事得多。
punct = false

# 启动默认状态（原 [general] 域）
[input.default]
remember_last_state = false
chinese_mode = true
full_width = false
chinese_punct = true
# 中英状态作用域："global"=所有应用共享（默认）；"app"=每个应用各自记忆中英文（会话级）
state_scope = "global"

# 标点：随中英、数字后智能英文标点、自定义映射
[input.punct]
follow_mode = false
smart_after_digit = true
smart_list = ".,:"
# custom_enabled 为自定义标点映射总开关；custom_mappings 留空时全部走内置默认转换
custom_enabled = false
# 自定义标点映射表：key = 源字符（引号用 "1/"2/'1/'2 区分左右），
# value = [中文半角, 英文全角, 中文全角, 英文半角]（空串或缺列 = 该状态回退默认转换）。
# 例：custom_mappings = { "." = ["。", "．", "。", "."] }
custom_mappings = {}

# 智能符号：同一标点在时限内连按两次，删前一字符替换为另一形态。
# 三个总开关互相独立，各管一种上下文，都默认关：
#   smart_mode         = 中文标点状态：连按 → 换英文（数字后智能标点方向相反，见下）
#   english_punct_mode = 中文输入 + 标点切英文：连按 → 换中文
#   english_mode       = 英文输入模式：连按 → 换中文
# 后两者拆成两个开关而非一个，是因为场景不同：前者是「用英文标点写中文、偶尔要个中文句号」，
# 后者是「正在打英文」。多数人只想要前者，英文态保持纯净。
[input.symbol]
smart_mode = false
smart_timeout_ms = 500
smart_chars = "。，？！：；、～￥·……——"
# 替换方案（「体感」与「兼容性」的取舍，故两者都保留）：
#   delete_replace（默认）= 首次按键直接上屏中文符号，再按一次删掉重打成英文。所见即所得、
#                           无预览态中间状态，实际体感更好；代价是依赖对宿主做删改。
#   hold_composition      = 首次按键开 TSF 组合态预览中文符号，再按一次替换组合提交英文；
#                           超时后自动提交中文。全程不做删改，**兼容性更好**，适合在
#                           delete_replace 下表现异常的宿主。
smart_method = "delete_replace"
# 英文标点状态（中文输入模式 + 工具栏标点切英文）下的智能符号
english_punct_mode = false
# 英文输入模式（整个输入法切英文）下的智能符号。开启会让 core 把下面 english_chars 里的键
# 推给输入法 DLL 吃下转发——英文半角下这些键本来直接透传给宿主，不吃就到不了引擎。
# 故此开关影响面比上一个大，默认关。
english_mode = false
# 参与英文智能符号的**源字符**集合（上面两个开关共用）。与 smart_chars 存中文产物不同，
# 这里存键本身的 ASCII 标点（`.` 而非 `。`）。
# 不建议放配对符（([{"' 等）：英文模式下这些键被吃走后配对改由引擎处理，而 DLL 的跳出栈是
# 空的，Tab 跳出会失效。
english_chars = ".,?!:;"

# 临时英文：Shift+字母（或 trigger_keys）进入的英文 overlay，打完一段即退回中文。
# ★ 只放**它独有**的按键语义。调频（frequency）与上屏补空格（commit_space）在
#   [schema.english] 段，与英文方案共用一套——同一件事只在一处配。
[input.temp_english]
enabled = true
# show_candidates：候选列表 = 原文 → 大小写变形（全小写/首字母大写/全大写，去掉与原文重复者）
#                  → 英文词库前缀匹配（保持词库原文大小写）。关闭则只留原文一条。
show_candidates = true
# raw_candidate：首候选恒是所打原文。默认开 = 保持一直以来的行为。
#   关掉后临英只出词库候选与变形候选；打词库里没有的词时按回车上屏（或候选为空时按空格）。
#   与 [schema.english] 那份是两个作用域各一份——临英与英文方案的取舍本就可能相反。
raw_candidate = true
# case_variants：是否生成上面那三条大小写变形候选。
#   它们每条都占一个候选位——每页 5 条时能吃掉一半，把词库候选挤到下一页；
#   且变形项没有词库带来的注释/词频，与词库候选交错时列表参差。
#   只想要英文词库补全、不需要大小写变换的人可以关掉。
case_variants = true
shift_behavior = "temp_english"
trigger_keys = []
# allow_symbols：符号与数字直接入缓冲（C++ / hello2 / x64）而非上屏退出或选词。总开关，
#                放行哪些字符由下面的 symbol_chars 精确决定。
allow_symbols = false
# symbol_chars：允许入缓冲的字符白名单，**逐字符字面匹配**（不支持 a-z 范围写法——`-` 在
#               符号集里太常用，当成范围元字符会静默放行一大片）。留空 = 一个都不放行。
#               列表外的字符一律维持 allow_symbols 关闭时的语义：符号「上屏高亮候选 +
#               转换后标点 → 退出」，`;`/`'` 选第 2/3 候选，`-=[],.` 翻页，数字键 1-9 选词。
#               ⚠ 列入的字符会交出上述职责：出厂含 `.` 与 `-` 是为了 obj.prop / e-mail /
#               snake_case，代价是临英下 comma_period、minus_equal 两个翻页键组各被劈掉
#               一半（上一页只剩 ↑ 与 PgUp），且「打完英文按句号上屏」失效。不需要就删掉它俩。
#               另：缓冲里一旦出现非字母字符（如 C++），数字键无条件入缓冲——此时词库查不到，
#               候选只剩原文与大小写变形，再把数字当选词键就打不出 C++11。
symbol_chars = "0123456789+-_.@#/"
# space_as_input：空格作为输入字符入缓冲（可打出带空格的英文短句）。上屏职责转给回车，
#                 且回车此时上屏「高亮候选」而非原文——否则该配置下没有任何选词键可用。
space_as_input = false
# candidate_layout：进入本模式期间的候选排列方向，各模式都有同名项。
#   follow（默认）= 跟随全局 ui.candidate.layout，用户改全局本模式跟着改
#   vertical / horizontal = 本模式期间覆盖全局方向，退出自动恢复
# 不是布尔：follow 与 vertical 只在全局本身竖排时才有区别（前者跟着变、后者恒定）。
# 临英常设 horizontal——英文候选一行放得下，全局竖排时反而占屏。
candidate_layout = "follow"
# 模式级注释模板（高级，无图形界面）：本模式期间覆盖全局 ui.candidate.comment_template_*。
#   不写这两个键 = 跟随全局；写空串 "" = 本模式不显示注释；写模板 = 本模式改用它。
#   「不写」与「写空串」是两回事，所以这里刻意不预置——预置任何值都会改掉默认语义。
#   临英的典型用法（挂了英汉注释库时，只在打英文时显示释义）：
# comment_template_vertical   = "${dict}"
# comment_template_horizontal = "${dict}"
# 同样的两个键在 [input.temp_pinyin]、[input.url]、[[schema.mix_modes]] 下也可用，
# 特殊模式的那份在方案文件的 [overlay] 段里。
# 注释模板共三层：模式级 → 方案级（方案文件 [candidate] 段）→ 全局（下方 [ui.candidate]）。
# 上面两层都是「不写=跟随下一层」，所以给某个方案单独配注释不必动全局。
# 说明见 https://windinput.com/docs/settings/appearance/candidate-comment

[input.capslock]
# 切中英模式（Shift 等切换键）时是否顺手取消大写锁定。仅此一处作用域——
# 切方案（直达热键 / 循环键 / 托盘）一律无条件取消大写并归位中文，不看本项：
# 那两件事是「用新方案打字」的前提，不是可选副作用。
cancel_on_mode_switch = false

[input.temp_pinyin]
enabled = true
trigger_keys = ["backtick"]
# 直达热键（如 "ctrl+shift+p"；空串 = 不注册）。与 trigger_keys 引导键共存，
# 用热键进入时组合区不写引导符。
hotkey = ""
candidate_layout = "follow"

[input.auto_pair]
chinese = false
english = false
chinese_pairs = ["（）", "【】", "｛｝", "《》", "〈〉"]
english_pairs = ["()", "[]", "{}", "<>"]
# 跳出配对的按键，可多选。"right_symbol" = 右符号键本身（打 ） 跳出已插入的 （）），
# 其余为键名 tab / enter / space / escape。列表里没有就是没有，不做隐式补偿。
# 引号等对称配对永不参与右符号跳出（按键不带「开/闭」信息），只能靠 tab / enter 跳出。
jump_out_keys = ["right_symbol"]
# 配对状态时效（秒），0 = 不过期。管的是同一个输入框内的状态陈旧：用户中途用鼠标点走、
# 把括号退格删掉之后，很久之后的 Tab 不该再被当成跳出键吃掉。
# 从最后一次按键算起，持续输入会不断刷新，在括号里打多久都不会误过期。
# 跨焦点不归它管——失焦一律清空配对状态。
state_ttl_secs = 120

# 生僻字模式：用**当前方案**的编码输入，候选只留生僻字。找一个平时打不出来的字时用。
#
# 进入方式在 [keys.key_actions]（全局）或方案文件的 [key_actions]（按方案分流），
# 动词写 "rare_char"：
#   单个符号键     backslash  = "rare_char"     引导键，空缓冲时按下即进
#   组合键         ctrl+shift+r = "rare_char"   直达热键，打字中途也能进（顶字重开）
# 本段刻意没有 enabled 与 trigger_keys —— 不绑任何键就等于关闭，绑了就是开。
#
# 模式内的行为（这几条是刻意的，不是没做完）：
#   · 只出单字，不出词
#   · 严格过滤，一个都没有就空着，不回补常用字
#   · 完全不参与词频：选了什么都不会影响正常输入的候选顺序
#   · 上屏即退出；Esc 也退出
#
# 也可以把它放进快捷输入（; 那个融合模式）当一个候选来源，在 mix_modes 的 members 里写
# "$rare_char"（真相源在代码侧 default_mix_modes()，本文件不写 mix_modes）。
# ⚠️ members 的**顺序即优先级**，而候选按文本先到先得去重：把 $rare_char 排在
# $primary_pinyin 后面的话，同一个生僻字会先被拼音成员收走，看起来就像这个成员没生效。
# 要让它有存在感就排在前面。
[input.rare_char]
# 引导键：空码时按下即进入本模式。出厂不绑任何键 ＝ 这个模式默认关闭。
# 与临时拼音/临时英文同：这里写的键会在加载时折算进 keys.key_actions（动词 rare_char），
# 两处写了同一个键时以 key_actions 为准。也可以直接写在 keys.key_actions 里。
trigger_keys = []

# **额外**纳入本模式的 Unicode 区块。生僻汉字本来就在，本项管的是默认字表管不着的那些
# 字符 —— emoji、注音符号、假名、间架结构符 ⿰ 之类。它们既不算常用也不算生僻，不在这里
# 写出来就永远不会出现在候选里。
#
# 取值为区块名或预设组名，两种写法都收（与 [schema.frequency] 的 exclude_blocks 同一套）：
#   预设组   emoji     —— 跨 5 个区块，比只写「表情符号」多出 ⚽ ✅ ⌚ 🇨🇳
#   预设组   符号      —— 标点、数学、箭头、图形、带圈数字、全角形式等；与 emoji 组不重叠
#   区块名   注音符号、平假名、表意文字描述符 …… 名字见候选右键的「类型」列
#   其它     —— 兜底档：新版 Unicode 新增的、本程序还不认识的区块全归这一档。
#              区块表是逐块列举的，漏一块的后果在这里是「那批字打不出」，故留这个开关。
#
# 出厂为空 = 只出生僻汉字。想连 emoji 一起找就写 include_blocks = ["emoji"]。
include_blocks = []

# URL 临时输入模式：正常输入下打出完整前缀（如 http / www.）即进入网址输入模式，
# 模式内自由输入网址字符（不触发上屏），空格或回车上屏。默认关闭。
[input.url]
enabled = false
prefixes = ["www.", "http", "https", "ftp."]
candidate_layout = "follow"

# 快捷加词面板（Ctrl+= 进入，见 [keys] add_word）。
# 默认竖排：逐字确认的面板竖排更易读。此前是硬编码强制竖排、没有开关。
[input.add_word]
candidate_layout = "vertical"

[input.s2t]
enabled = false
variant = "s2t"

[input.cmdbar]
enabled = false
candidate_prefix = "⚡"

# 短语前缀列举（原 [dict.phrase]）
[input.phrase]
min_prefix = 2

[keys]
toggle_mode_keys = ["lshift", "rshift"]
commit_on_switch = true
switch_engine = "ctrl+shift+e"
toggle_full_width = "shift+space"
toggle_punct = "ctrl+."
delete_candidate = "ctrl+shift+number"
pin_candidate = "ctrl+number"
toggle_toolbar = 'ctrl+shift+\'
open_settings = "ctrl+shift+]"
add_word = "ctrl+equal"
open_add_word_dialog = "ctrl+shift+equal"
toggle_s2t = "ctrl+shift+j"
activate_ime = "ctrl+shift+["
take_screenshot = "ctrl+shift+f11"
# 改用系统级 RegisterHotKey 抢占的**动作名**列表（不是键串）：列进来的动作会绕开宿主
# 自身的同名快捷键。仅支持无需按键上下文的 7 个动作：
#   switch_engine / toggle_full_width / toggle_punct / toggle_toolbar /
#   open_settings / take_screenshot / toggle_s2t
# 写入其它名字只会进 warn 日志并被忽略。activate_ime 不在此列（走系统
# DirectSwitchHotkeys 注册表，不经 RegisterHotKey）。空 = 全部走普通键盘钩子。
global_hotkeys = []
# ⚠ schema_hotkeys（方案直达热键）已废弃并入下面的 key_actions，写作
#   switch_schema:<方案id>。**不做自动迁移**：残留的旧段只在启动日志里告警一次，
#   请按告警提示手改。
#   合并的理由：两处配的是同一件事、只差单向/往返，却编译进同一张热键表，
#   同一个键两处都配时后者静默失效；且旧表不校验键形态，写单个字符键会让
#   那个字符再也打不出来。
# 按键功能表：key = 热键串，value = 动词。与上面「一个功能一个字段」的写法不同，
# 这是「这个键干什么」的通用表，方案文件的 [key_actions] 用同一套动词值域
# （见 docs/design/schema-key-actions.md）。
# 当前支持的动词：
#   switch_schema:<方案id>  切到该方案，**单向**（原 schema_hotkeys 的语义）
#   toggle_schema:<方案id>  切到该方案，**再按一次回到来源方案**
#   special:<方案id>        进该方案的 overlay（打完一段自动退回）
#   softkeyboard            开 / 关软键盘面板
#   softkeyboard:<面id>     开软键盘并直接切到那一面（面 id 见 system.softkeyboard.toml，
#                           如 punct / num / math / greek）。已开着时按它只切面、不关闭，
#                           所以给几个面各配一个键不会互相打架。
# 例：key_actions = { "ctrl+shift+r" = "switch_schema:wubi86" }
# 单向与往返的差别只在回程：前者切过去就完了，后者再按一次回到你原来那个方案。
# 切方案类动词两层都能写。写在方案文件的 [key_actions] 里只在该方案活跃时生效；
#   单向切过去后，那个键在目标方案里不再做事（不会改而去执行全局同名绑定），
#   回程请另配一个键，或改用 toggle_schema。
# ⚠ 英文状态（半角英文）下方案文件的 [key_actions] 整表不生效，只按本表执行。
# 键的形态决定它走哪条通路：组合键 → 热键表；纯修饰键（rshift）→ 轻敲；
#   单个字符键 → 引导键链（切方案类动词不可用，那条链在英文模式下走不到）。
# 无法识别的动词只进 warn 日志并被忽略。
key_actions = { "ctrl+shift+k" = "softkeyboard" }
# 会话态按键功能表：key = 键名，value = 动词。管的是「**正在打字**（有编码或候选）时这个
# 键干什么」；上面的 key_actions 管的是「给这个键指定一个功能」，不以正在打字为前提。
# 两张表可以给同一个键各配一份，各自在各自的条件下生效（如 Tab 打字时翻页，没在打字时
# 仍是宿主的制表符）。
# 键名：tab / shift+tab / capslock / pageup / pagedown / up / down / left / right / home /
#       end，以及符号键 minus equal lbracket rbracket comma period semicolon quote 等。
#       只认 shift+ 一种前缀；带 ctrl/alt 的组合键请写在上面的 key_actions 里。
# 动词：page_prev / page_next / highlight_up / highlight_down
#       cancel(放弃当前输入，等同 Esc；别名 clear) / none(在本态禁用该键)
#       select_candidate:N(选中当前页第 N 个候选，N 从 1 起，2 即次选键)
#       select_char:N(以词定字，取高亮候选词的第 N 个字，N 从 1 起)
#       aux_code(进辅助码筛选：对已出的拼音候选按字形再筛一轮。需已开启辅助码
#           [schema.pinyin.aux_code].enabled、方案配了码表、且当前有候选，否则不吞键)
#       aux_code:page_next(同上，但与下翻页共用一个键：能进辅助码就进、进不去就翻下一页。
#           已经在辅助码里 / 辅助码没开 / 方案没配码表时，这个键就是个纯翻页键)
# 例（Tab 向下翻页、CapsLock 向上翻页）：
#   session_actions = { tab = "page_next", "shift+tab" = "page_prev", capslock = "page_prev" }
# 例（Tab 一键两用：第一次按进辅助码筛选，之后按继续翻页）：
#   session_actions = { tab = "aux_code:page_next" }
# 例（嫌 Esc 太远，用 Tab 放弃这一段）：
#   session_actions = { tab = "cancel" }
# 本表只存**你显式配的**键。下面四项 page_keys / highlight_keys / select_key_groups /
# select_char_keys 各自独立保存，**运行时**才与本表合并（本表写了的键优先）——两边都
# 保持原样，改一处不会动到另一处。出厂默认留在那四项里、不写在这，这样把它们清成 []
# 就真的能关掉对应功能。
# 撞键时按消费顺序裁决：以词定字 > 翻页/高亮 > 二三候选。
# ⚠ capslock 与其它键不同：Windows 的大小写锁定状态在输入法拿到按键之前就已翻转，
#   压不住。故本项一旦配了 capslock，程序会安装一个全局键盘钩子，在系统改状态之前
#   拦下它（打字时才拦，空闲时 CapsLock 照常切大小写）。**不配 capslock 就完全不装
#   这个钩子。** 副作用：极少数安全软件会对全局键盘钩子告警。
session_actions = {}
# 二三候选键（第1键选第2候选、第2键选第3候选）。可选键组：
#   semicolon_quote(;/') / comma_period(,/.) / lrshift(左右Shift) / lrctrl(左右Ctrl)
# 修饰键组（lrshift/lrctrl）在**松开**时才选词，且只认「轻敲」——按住超过 500ms 或中途
# 按了别的键都不算，否则 Ctrl+A 的那一下 Ctrl 就会选走候选。与 toggle_mode_keys 撞键时：
# 有候选选词，无候选切中英文（候选不足以命中该位次则吞键，不切换）。
select_key_groups = ["semicolon_quote"]
page_keys = ["pageupdown", "minus_equal"]
highlight_keys = ["arrows", "tab"]
# 以词定字：用成对标点键从当前高亮候选词中逐字上屏（第1键取第1字、第2键取第2字）。
# 可选键组 comma_period(,/.) / minus_equal(-/=) / brackets([/])；空数组=禁用。
# 词长不足时按 [keys.overflow].select_char_key 策略处理。
select_char_keys = []

# 无效按键策略（候选不足以命中目标位次时）：ignore=吞键 / commit=上屏高亮候选 /
# commit_and_input=上屏高亮候选并追加该键字符。number_key=数字键、select_key=次/三选键、
# select_char_key=以词定字键。
[keys.overflow]
number_key = "ignore"
select_key = "ignore"
select_char_key = "ignore"

[ui.candidate]
# 首显用过非权威坐标时，权威坐标与它相差在「行高 × 本值」以内就不再校正。
# 校正动作本身才是抖动的观感来源；换行/重排的偏差远超此阈值，仍会正常校正。0 = 关闭容差。
first_show_settle_ratio = 0.8
# 两次按键间隔小于此毫秒数即视为连续输入，first_show_mode="fast" 时直接采信首条试探坐标
# （连打不重排，跟手比精确更重要）。0 = 关闭该快路径。
fast_typing_window_ms = 100
# first_show_mode="fast" 的兜底超时（毫秒）：等不到试探/权威坐标就用现有坐标先显示。
# 必须远小于 wait 档的 150ms——Word 这类宿主不发 OnLayoutChange 且组合坐标要 60~190ms 才到，
# 连打时组合只活 27~57ms，上屏即作废 timer，150ms 兜底永远不会到期（fast 就退化成 wait）。
fast_first_show_fallback_ms = 25
font_size = 18
font_size_follow_theme = true
per_page = 7
per_page_extended = 0
max_chars = 16
# 候选窗的最小尺寸，单位 dp（逻辑像素，0=关闭，跟随内容）。横排/竖排各配一套：
# 两种排布可用的横向空间差一个数量级（竖排每行独占，横排全部候选共享一行）。
# 下限量的是整个窗口而不是单个候选：候选照常按内容紧凑排列并左对齐，凑不满的部分
# 留空——横向 100dp 而首两个候选各占 30/20dp 时，两者仍按原本方式并排，右侧空着。
# 翻页栏、编码栏、各级内边距一并计入，故「窗口大小不变」可以直接达成。
# 窗口翻到光标上方时，多出的高度补在顶部（否则贴光标的那一端被空白顶开）。
# 竖排宽度下限与主题 behavior.vertical_max_width（上限）冲突时下限优先。
min_window_width_horizontal = 0
min_window_width_vertical = 0
min_window_height_horizontal = 0
min_window_height_vertical = 0
# 竖排候选窗的最小行数（0=关闭，高度跟随候选数）。不足时补等高的透明空行，使窗口
# 高度在候选数变化时保持不变；上限自动钳到 per_page（补出比一页还多的空行没有意义）。
# 横排不适用（候选并列于一行，高度本就恒定）。
# 只稳住候选区：翻页栏/编码栏的出现消失不在其量程内，要连这些一并罩住用
# min_window_height_vertical（两项可同时配，取较大者）。
min_rows = 0
# 候选注释段（候选右侧灰字）模板。横排/竖排各一份、互不影响——两种排布能放的宽度差一个
# 数量级（竖排每行独占，横排全部候选共享一行）。
#
# 语法：
#   ${name}      变量替换
#   ${a|b|c}     取首个非空的变量
#   { ... }      可选段：段内变量全为空则整段（含字面文字）消失
#   另：空变量会吞掉紧邻的一个空格；整个模板的变量全空时不显示任何内容。
#
# 可用变量：
#   code_hint          引擎产的编码提示（码表前缀候选的剩余编码 si→sikao 标 kao；混输标记「拼」）
#   code               主码表整词反查编码（仅拼音来源候选，且受方案 show_code_hint 门控）
#   pinyin             带声调注音 nǐ hǎo（多音字按词典消歧：「行长」得 háng zhǎng 而非 xíng cháng）
#   chaizi             拆字字根串，仅单字候选（需方案配了 [engine.chaizi]）
#   chaizi_code        该字在拆字库里的编码，仅单字候选
#   chaizi_all[:分隔符] 拆字字根不限字数，默认空格连接；如 ${chaizi_all:／}（可能很长，慎用于横排）
#   dict               挂载的注释词库里该词的注释（见下方 [[ui.comment_dicts]]）
#
# 出厂值 ${code_hint|code} 等价于本功能引入前的固定行为。
# 例：竖排显示字根与注音 → "{〔${chaizi}〕}{ ${pinyin}}"
# 完整说明与更多示例：https://windinput.com/docs/settings/appearance/candidate-comment
comment_template_vertical = "${code_hint|code}"
comment_template_horizontal = "${code_hint|code}"
# 注释段最大字数（0=不限），超出截断并加省略号。横竖各一份：横排全部候选共享一行宽度，
# 竖排每行独占，能放多少本就不是同一个答案。
comment_max_chars_vertical = 0
comment_max_chars_horizontal = 0
# 注释词库（供 ${dict} 变量查询）不随附任何内容——词典多有版权，由用户自行放置。
# 需要时在**用户配置**里按下面的形态增补（出厂为空，故此处不预置）：
#
#   [[ui.comment_dicts]]
#   id = "emoji"                          # 稳定标识（日志/设置页定位用）
#   label = "Emoji 名称"
#   path = "comments/emoji.dict.yaml"     # 相对 schemas/；用户目录优先，回落安装目录
#   enabled = true
#   schemas = []                          # 限定生效方案；留空=全部方案
#
# path 以 schemas/ 为基准（同拆字库、字根字体等方案附属资源）。放在那里是有意的：
# 整机备份打包的是整个 schemas 目录（递归），注释库因此自动随备份走，
# 不必再单列一处「记得也要备份」的目录。
#
# 数组顺序即优先级（同一个词多库都有注释时取靠前的）。schemas 用来避免无谓开销：
# 一份大英汉词典写 schemas = ["english"] 后，中文方案下根本不加载。
# 格式与更多示例：https://windinput.com/docs/settings/appearance/candidate-comment
layout = "horizontal"
# 编码显示方式：app_inline=内嵌应用光标处(候选窗不显 preedit) | candidate_top=候选窗顶部独立栏 | candidate_inline=编码内联候选首单元
preedit_display = "app_inline"
# 候选窗上翻到光标上方时的两个正交行为开关（可单独或叠加）：
flip_when_above = false          # 反转候选项排列顺序（仅竖排 layout="vertical" 生效）
                                 # 反转期间上下条目键（↑↓ / Shift+Tab、Tab）按屏幕方向走，翻页键不受影响
swap_preedit_when_above = false  # 交换编码栏与候选栏位置（编码沉底贴光标）
# 完全不显示候选窗（与上翻无关的独立开关；盲打用）。
hide_window = false
index_labels = []
pager_bar_display = ""
page_number_display = ""
pager_in_preedit = false         # 翻页栏并入编码栏行右对齐（竖排省一行；仅 candidate_top 生效）
# 定位方式：follow_caret=跟随光标（默认） | fixed=固定屏幕位置（不再随光标移动，也不再上翻）
position_mode = "follow_caret"
# 固定模式下的内容左上屏幕坐标，由拖动候选窗落盘；(0,0)=尚未设定，首显落到屏幕默认锚点。
custom_x = 0
custom_y = 0

[ui.font]
family = ""
path = ""
render_mode = "directwrite"
# family 缺字时按序接续的字体；最终链 = [family] + fallback
fallback = []
# 按脚本单独指派字体：键取 latin/greek/cyrillic/cjk/emoji/digits/punct，值是该类自己的字体链
scripts = {}

[ui.theme]
name = "default"
style = "system"

[ui.mode_indicator]
# 进入临时拼音/双拼/快捷/英文/快符等模式时的标识：short=短称(拼/双/快/英/符) | full=全称(临时拼音…) | none=不显示
style = "short"

[ui.status]
enabled = true
duration = 800
display_mode = "temp"
# 焦点切换到新输入框时也强制显示一次（提示"这个框现在是什么状态"）。
# follow_caret 定位模式下，只有取到 TSF 权威坐标才显示——拿不到宁可不显示，也不弹在错位置。
show_on_focus = false
schema_name_style = "full"
position_mode = "follow_caret"
offset_x = 0
offset_y = 0
custom_x = 0
custom_y = 0
# 气泡显示哪些内容段；留空 = 全部显示。可选：schema/punct/full_width/s2t/caps
items = ["schema", "punct", "full_width", "s2t", "caps"]

# 悬停提示：原 ui.tooltip.{code,pinyin,chaizi,debug}.* 子表已拍平为平铺字段
[ui.tooltip]
delay = 200
code_enabled = true
pinyin_enabled = true
pinyin_heteronyms = true
pinyin_max_readings = 0
chaizi_enabled = false
debug_enabled = false

[ui.toolbar]
visible = true
hide_in_fullscreen = true
# 自动隐藏：显示后 auto_hide_delay 秒无交互则 1 秒淡出（悬停/拖动顺延；默认关）
auto_hide = false
auto_hide_delay = 5
# 纵向排列：竖着摆放工具栏（默认横条）。几何仍取主题 [toolbar]，条宽=height、每格高=button_width。
vertical = false
# 显示哪些格、按什么顺序（数组顺序即从左到右 / 从上到下的顺序）；留空 = 全部显示。
# 可选：mode（中英/方案）/punct（标点）/full_width（全半角）/s2t（简繁）/
#       soft_keyboard（软键盘）/settings（设置）
# 名字前加 - 表示「不显示，但记住它排在这个位置」，如 "-s2t"——设置页关掉某格时就是
# 这么写的，于是关掉再打开它还在原位，而不是跳回默认顺序。
# s2t 格出厂关着；去掉下面那个 - 即可，之后点它就能随时开关简入繁出。
# 整条工具栏都不想要请用 visible = false，别把每一项都加上 - 前缀。
items = ["mode", "punct", "full_width", "-s2t", "soft_keyboard", "settings"]

# 自定义按钮（高级功能，出厂无）。定义在 [[ui.toolbar.buttons]]，**要显示还得在上面的
# items 里写一条 custom:<id>**——items 是「显示哪些、排第几」的唯一真相源，光定义不显示。
# 本段刻意不在此文件写出数组表：写一行空数组没有信息量，却会把它冻结成预置值，
# 之后用户增删按钮要与整表覆盖语义纠缠。照下面的样子写进你自己的 config.toml 即可。
#
#   [ui.toolbar]
#   items = ["mode", "punct", "full_width", "custom:sym", "settings"]
#
#   [[ui.toolbar.buttons]]
#   id = "sym"                          # 稳定标识，被 items 里的 custom:sym 引用
#   label = "符"                        # 格内文字：一个汉字，或两个字母（超出自动截断）
#   action = 'proc.run("charmap.exe")'  # 点击执行，语法同短语/命令栏的动作
#   enabled = true                      # 关掉即不显示，items 里那条留着记住位置
#
# action 可用的写法与短语里一样，常用几种：
#   open("https://www.zdic.net")            打开网址 / 文件 / 程序（跟双击一样的效果）
#   proc.run("notepad.exe")                 启动程序，可带参数与 cwd=/verb=/show=
#   wind.cli("schema switch wubi86")        调用本输入法的命令，如一键切方案
#   key.tap("Ctrl+Shift+P")                 模拟一次按键组合
# 注意 action 要用单引号包起来（里面有双引号）。

# 语言栏图标 = Windows 任务栏上那个「中/英/拼/五」的输入指示器（仅 Windows）。
# 这里配的是叠在主字上的状态角标：什么状态下画、画在哪个角、什么颜色、多大。
# 默认整体关着——它是加在系统图标上的新东西，默认改变所有人的任务栏是过界的。
[ui.langbar]
# 总开关。none=不显示（默认）｜corner=角标（角落上的直角三角）
# 关掉即下面全部规则都不画，不必逐条去关。
badge = "none"
# 角标整体大小倍率（1.0 = 基准尺寸）。单条还能用自己的 scale 再乘一次。
badge_scale = 1.0
# 角标不透明度的默认值；单条可以用色值末两位（见下面 color_*）自己覆盖。
# 它同时是档位开关：
#   = 1.0  实心 + 在角标周围挖掉一圈主字（靠留白分离，字会被切掉一角）
#   < 1.0  半透明 + 保留主字，笔画从角标里透出来（半遮，默认）
# 两者是互斥的分离手段，不要指望"挖空 + 调淡"叠加——那样调这个值会看起来毫无效果。
badge_alpha = 0.88

# 角标规则表：一条规则 = 「某状态成立时，在某个角落用某色画一个角标」。
# 顺序即优先级——两条规则若配在同一个角落又同时成立（如把全角也挪到右下），
# 只画最靠前的那一条；16px 上叠两个三角会糊成一片。
#
# enabled  这条画不画。想要「中文标点时不受打扰、只在英文标点时提醒」，
#          把下面第一条改成 false 即可，颜色和位置都还留着。
# state    punct_cn（中文标点）｜punct_en（英文标点）｜full_width（全角）
#          只有这三个；写错会让整条规则被丢弃（日志里有警告）。
# corner   top_left｜top_right｜bottom_right｜bottom_left
# color_*  浅色 / 深色任务栏上各用什么色：#RRGGBB、#RRGGBBAA，或 auto = 与主字同色。
#          三色的色相互相拉开，16px 下靠色相区分远比靠形状可靠。
#          末两位 AA 是这一条自己的不透明度（跟网页一个写法），不写就用上面的
#          badge_alpha。注意填 FF 不只是"最不透明"，它会把这一条切成实心挖空那一档。
# scale    本条相对整体大小的额外倍率（1.0 = 与其他角标同大）。
[[ui.langbar.badges]]
enabled = true
state = "punct_cn"
corner = "bottom_right"
color_light = "#2288E0"
color_dark = "#2288E0"
scale = 1.0

[[ui.langbar.badges]]
enabled = true
state = "punct_en"
corner = "bottom_right"
color_light = "#EE9922"
color_dark = "#EE9922"
scale = 1.0

[[ui.langbar.badges]]
enabled = true
state = "full_width"
corner = "top_right"
color_light = "#E0447A"
color_dark = "#E0447A"
scale = 1.0

# 非中文态显示的主字，同时作用于语言栏图标、工具栏模式格、状态气泡。
# 中文态的主字不在这里——那是方案的属性，配在方案文件的 [schema] icon_label。
# 最多 2 个字符（两个字母的宽度约等于一个汉字）；留空则用括号里的内置默认值。
[ui.labels]
english = "英"   # 英文半角：左/右 Shift 切出的英文态，按键原样透传
caps_lock = "A"  # 大写锁定

[stats]
enabled = true
track_english = true
# 打字速度的修正系数，只作用于速度展示，不影响任何字数统计。
# 采集期已修掉三条结构性偏差（毫秒分母 / 段首口径对称 / 短码长词封顶），剩下
# 「输入法无从知道用户打错了没有」修不掉——打错后退格重打，字符计两遍而耗时只算一遍，
# 方向恒为正偏差，故出厂取 < 1 做经验折价。填 >= 1 只会让显示值重新偏离真实手速。
speed_factor = 0.85

[debug]
# trace / debug / info / warn / error。注意 info 及以下级别不得含用户输入内容与候选词。
log_level = "info"
# 单个日志文件大小上限（MB），超出即滚动。
log_max_size_mb = 10
# 保留的旧日志文件数上限（不含主文件）。服务每次启动都会滚动一次，
# 故该值约等于「能回溯最近几次运行」。
log_max_files = 10

# ── mobile：移动端对上面各域的覆盖 ─────────────────────────────────────────────
#
# 桌面构建**完全无视本域**，读都不读。少数配置项的最优值在两个平台上就是不同的，
# 差异写在这里。
#
# ⛔ 不要改用「值域哨兵」表达平台差异（让某个键取 "auto"、由宿主按平台解释）：那样
#    平台知识就进了值域，设置界面被迫列一个语义空洞的「自动」选项，用户看不出选了会
#    得到什么，而 core 侧还要为它维护一套 platform_default_* 分支。
#
# 只写**当前真有平台差异**的键：本域里出现的键，移动端就用这里的值；没出现的键沿用
# 上面的桌面基线。别提前铺一排永远等于基线的键——每个都要在 REGISTRY、本文件、
# capability 快照、设置页豁免名单里各占一行，改基线时还得记得改另一边。

[mobile.association]
# 移动端默认智能联想：软键盘上每多打一个字都很贵，连标点带下一个词一起猜才划算。
kind = "smart"
# 移动端默认持续联想：软键盘上方的联想栏本就常驻，多显示一行没有额外遮挡成本。
mode = "continuous"
# 移动端开标点联想：软键盘上打标点要切键盘层，从候选里点走省事得多。
# 桌面相反（[input.association] 里 punct = false）——实体键盘上标点一键可达。
punct = true
