# 「其它」= 区块表**之外**的一切，即上面所有区间的补集。
#
# ★ 它存在的理由：区块表逐块列举一份仍在增长的 Unicode 区间，新版本的新块必然落进这里。
# 对**准入**类消费者（生僻字模式）而言，漏一块 = 那批字打不出——不安全的方向。
# 给出这一档，新块就落进一个用户控制得到的开关，而不是静默消失。
- key: 其它
  ranges:
    - U+0000-U+001F
    - U+0080-U+009F
    - U+0250-U+036F
    - U+0500-U+1FFF
    - U+20D0-U+20FF
    - U+2400-U+245F
    - U+27C0-U+2E7F
    - U+2FE0-U+2FEF
    - U+4DC0-U+4DFF
    - U+A000-U+DFFF
    - U+FB00-U+FE2F
    - U+FE50-U+FEFF
    - U+FFF0-U+1F1E5
    - U+1F200-U+1F2FF
    - U+1FB00-U+1FFFF
    - U+2A6E0-U+2A6FF
    - U+2EE60-U+2F7FF
    - U+2FA20-U+2FFFF
    - U+33480-U+10FFFF
  order: 900

# 预设组「符号」—— 标点、数学、图形这一类**非 emoji** 的符号块的并集。
#
# ⚠️ 与 emoji 刻意不相交：勾「符号」不该顺带把 emoji 也放进来，否则界面上两个开关的
# 关系说不清楚。emoji 不在这里——它由 charsets/emoji.yaml 那份按 UTS #51 生成的精确
# 字表给出（「五个块并集」的老口径两个方向都不准，见设计文档 §5.5）。
- key: 符号
  ranges:
    - U+2000-U+206F
    - U+2070-U+209F
    - U+20A0-U+20CF
    - U+2100-U+214F
    - U+2150-U+218F
    - U+2190-U+21FF
    - U+2200-U+22FF
    - U+2460-U+24FF
    - U+2500-U+257F
    - U+2580-U+259F
    - U+25A0-U+25FF
    - U+2FF0-U+2FFF
    - U+3000-U+303F
    - U+3200-U+32FF
    - U+3300-U+33FF
    - U+FE30-U+FE4F
    - U+FF00-U+FFEF
  order: 1000
