---
# 常用汉字类 —— 复现「通用规范汉字表」那套既有判定，出厂行为与本类出现之前完全一致。
#
# 这个类是唯一一个同时用到 scope / file / outside 三个字段的：
#   scope: han      本类「管得着」谁 —— 汉字 ∪ 私用区（PUA 被本码表当汉字使用）
#   file:           管辖域内的白名单
#   default/outside 域内在名单 → 常用；域内不在名单 → 生僻；域外 → 不表态（兜底判常用）
#
# ★★ outside 这个字段承载的是「生僻字是补集」那件事：名单列的是常用字，而
# 「是汉字、却不在名单里 ⇒ 生僻」用成员关系表达不了 —— 那个字压根不是本类成员。
# 没有它，「换一本常用字表」这个需求做不到。
#
# ⚠️ file 指向 schemas/common_chars.txt 而不是把 8104 字搬进本文件，是为了**兼容既有
# 用户**：那个文件早就支持整份覆盖（放一份同名文件到用户配置目录的 schemas/ 下即可），
# 搬家会让已经这么做的用户静默失效，而他完全看不出原因。
#
# 要调整：不要改本文件。在用户配置目录的 charsets/ 下新建一个 .yaml，
# 写 `key: common_han` 加你要改的字段；列表增删写 `烎` / `-烎`。
key: common_han
name: 常用汉字
order: 50
scope: han
file: common_chars.txt
default: common
outside: rare
