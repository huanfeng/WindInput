name: Release Published

# Release 正式发布(release.yml 产出草稿 → 人工审核 Release Notes → 点 Publish)的下游动作:
#   1. notify-docs  通知文档仓同步更新记录 → data/releases.json → 驱动 /changelog 与 /download
#   2. sync-to-r2   把安装包与在线升级元数据推到 Cloudflare R2(dl.windinput.com)
#   3. winget       向 microsoft/winget-pkgs 提交新版本清单(`winget install windinput`)
#   4. scoop        通知 huanfeng/scoop-bucket 把 windinput-np 升到新版(`scoop install huanfeng/windinput-np`)
#
# 两平台各一套元数据:latest.json(exeUrl,Windows)与 latest-mac.json(pkgUrl,macOS)。
# 键名故意不同,好让「客户端读到另一平台的元数据」在解析阶段就被拒 —— 客户端侧对应实现见
# wind-setting 的 src/update/mod.rs::Artifact。macOS 产物按「有则同步」处理:补同步老 Release
# 时它不存在,不该拖垮 Windows 那半。
#
# 配置项(Settings → Secrets and variables → Actions)。缺任一项时对应 job 跳过而非失败:
#   Variables:
#     DOCS_REPO    文档仓 owner/name,如 huanfeng/WindInputDocs
#     R2_BUCKET    Cloudflare R2 bucket 名
#     R2_BASE_URL  R2 自定义域名,如 https://dl.windinput.com(不含结尾斜杠)
#   Secrets:
#     DOCS_REPO_PAT          对文档仓有 contents:write 的 PAT(GITHUB_TOKEN 跨仓无效)
#     CLOUDFLARE_API_TOKEN   具备 R2 Edit 权限的 Token
#     CLOUDFLARE_ACCOUNT_ID  Cloudflare 账户 ID
#     WINGET_TOKEN           classic PAT(public_repo),其所有者名下要有 microsoft/winget-pkgs 的 fork
#     SCOOP_TOKEN            对 huanfeng/scoop-bucket 有 contents:write 的 PAT(与 wind-dict 等姊妹项目同名)
#
# ⚠️ 依赖 release.yml 的 draft: true。GitHub 不会为 GITHUB_TOKEN 发起的动作触发新 workflow
# (防递归),若把 release.yml 改成直接发布正式版,release:published 事件不会产生,本工作流
# 将静默失效 —— 届时需改由 release.yml 内联这两段逻辑。
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "要补同步的 Release tag(如 v0.109.0)"
        required: true
        type: string
      r2_only:
        description: "只补同步 R2(不通知文档仓、不提 winget、不通知 Scoop;已发布版本补传产物时用)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read          # gh release download / view

jobs:
  notify-docs:
    name: 通知文档仓同步更新记录
    if: ${{ !inputs.r2_only }}
    runs-on: ubuntu-latest
    env:
      DOCS_REPO: ${{ vars.DOCS_REPO }}
      PAT: ${{ secrets.DOCS_REPO_PAT }}
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      PRERELEASE: ${{ github.event.release.prerelease || false }}
    steps:
      # 文档仓侧由 .github/workflows/sync-changelog.yml 接收 changelog-updated,
      # 取 Release body 的 user-facing 标记块写入 data/releases.json 并开 PR 自动合并。
      # 该仓另有每天 04:00 CST 的 schedule 兜底,故此处失败只会退化为最长约一天的延迟。
      - name: 发送 repository_dispatch
        run: |
          # 预发布不进文档站(文档仓脚本也会跳过,这里先不发,省一次空跑)。判据同 sync-to-r2。
          if [ "$PRERELEASE" = "true" ] || [[ "${TAG#v}" == *-* ]]; then
            echo "::notice::$TAG 是预发布版本,不通知文档仓。"
            exit 0
          fi
          if [ -z "$DOCS_REPO" ] || [ -z "$PAT" ]; then
            echo "::warning::未配置 vars.DOCS_REPO 或 secrets.DOCS_REPO_PAT,跳过通知;文档仓的每日 schedule 会兜底同步。"
            exit 0
          fi
          jq -n --arg tag "$TAG" \
            '{event_type: "changelog-updated", client_payload: {tag: $tag}}' \
            | curl -fsS -X POST \
                -H "Accept: application/vnd.github+json" \
                -H "Authorization: Bearer $PAT" \
                "https://api.github.com/repos/${DOCS_REPO}/dispatches" \
                --data-binary @-
          echo "已通知 ${DOCS_REPO} 同步 $TAG"

  sync-to-r2:
    name: 同步安装包与升级元数据到 R2
    runs-on: ubuntu-latest
    env:
      R2_BUCKET: ${{ vars.R2_BUCKET }}
      R2_BASE_URL: ${{ vars.R2_BASE_URL }}
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PRERELEASE: ${{ github.event.release.prerelease || false }}
    steps:
      - name: 检查 R2 配置是否完整
        id: gate
        run: |
          VERSION="${TAG#v}"
          # 预发布不进 R2:latest*.json 是正式版的升级开关,写进去全体用户就会被应用内升级
          # 推到预发布;清理步骤还会删掉上一个正式版的安装包。beta 只走 GitHub 预发布。
          # 判据与 winget / Scoop 相同:Release 勾了 pre-release,或版本号带 '-'。
          if [ "$PRERELEASE" = "true" ] || [[ "$VERSION" == *-* ]]; then
            echo "::notice::$TAG 是预发布版本,不同步 R2(不改应用内升级元数据)。"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          elif [ -z "$R2_BUCKET" ] || [ -z "$R2_BASE_URL" ] \
             || [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::R2 配置不完整(vars.R2_BUCKET / vars.R2_BASE_URL / secrets.CLOUDFLARE_API_TOKEN / secrets.CLOUDFLARE_ACCOUNT_ID),跳过 R2 同步。"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        if: steps.gate.outputs.skip != 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: 安装 wrangler
        if: steps.gate.outputs.skip != 'true'
        run: npm install -g wrangler@4

      # 产物名以打包脚本为唯一口径:pack-installer.sh 与 dev.ps1 均产出
      # WindInput-Setup-<版本>.exe。dev.ps1 的 exeUrl 直接用产物名拼 CDN 地址,
      # 故 R2 上的对象名必须与之逐字一致,否则在线升级会下到 404。
      - name: 从 Release 下载安装包与发布说明
        if: steps.gate.outputs.skip != 'true'
        id: dl
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${TAG#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          mkdir -p dl
          gh release download "$TAG" --repo "${{ github.repository }}" \
            --pattern "WindInput-Setup-${VERSION}.exe" --dir ./dl
          gh release download "$TAG" --repo "${{ github.repository }}" \
            --pattern "WindInput-Setup-${VERSION}.exe.sha256" --dir ./dl
          # macOS 包按「有则同步」处理:workflow_dispatch 补同步老 Release 时它并不存在,
          # 那种情况下缺 mac 产物是正常的,不该让整条 Windows 同步跟着失败。
          if gh release download "$TAG" --repo "${{ github.repository }}" \
               --pattern "WindInput-${VERSION}-macOS.pkg" --dir ./dl 2>/dev/null; then
            gh release download "$TAG" --repo "${{ github.repository }}" \
              --pattern "WindInput-${VERSION}-macOS.pkg.sha256" --dir ./dl
            echo "mac=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::该 Release 没有 macOS 安装包,跳过 mac 同步。"
            echo "mac=false" >> "$GITHUB_OUTPUT"
          fi
          # Linux 包同样「有则同步」:两个架构一起要(缺一个说明发布不完整,宁可不同步也不推半套)。
          if gh release download "$TAG" --repo "${{ github.repository }}" \
               --pattern "WindInput-${VERSION}-linux-*.deb*" --dir ./dl 2>/dev/null \
             && [ -f "./dl/WindInput-${VERSION}-linux-amd64.deb" ] \
             && [ -f "./dl/WindInput-${VERSION}-linux-arm64.deb" ]; then
            LINUX_OK=1
            echo "linux=true" >> "$GITHUB_OUTPUT"
          else
            LINUX_OK=0
            rm -f ./dl/WindInput-*-linux-*.deb*
            echo "::warning::该 Release 没有完整的 Linux 安装包(amd64 + arm64),跳过 Linux 同步。"
            echo "linux=false" >> "$GITHUB_OUTPUT"
          fi
          # rpm(试验性)同样「有则同步」,但不是硬依赖:缺了只是 latest-linux.json 没有 rpms 字段,
          # deb 照发(与 release.yml 里 rpm 缺了只告警同口径)。两个架构一起要,缺一个就整组不推。
          if [ "$LINUX_OK" = "1" ] \
             && gh release download "$TAG" --repo "${{ github.repository }}" \
                  --pattern "WindInput-${VERSION}-linux-*.rpm*" --dir ./dl 2>/dev/null \
             && [ -f "./dl/WindInput-${VERSION}-linux-x86_64.rpm" ] \
             && [ -f "./dl/WindInput-${VERSION}-linux-aarch64.rpm" ]; then
            echo "rpm=true" >> "$GITHUB_OUTPUT"
          else
            rm -f ./dl/WindInput-*-linux-*.rpm*
            echo "::notice::该 Release 没有完整的 rpm(x86_64 + aarch64),latest-linux.json 不带 rpms。"
            echo "rpm=false" >> "$GITHUB_OUTPUT"
          fi
          # 升级元数据里的 releaseNotesUrl 指向它(命名口径见 dev.ps1 New-UpdateManifest)
          gh release view "$TAG" --repo "${{ github.repository }}" --json body -q .body \
            > "./dl/WindInput-${VERSION}-Release.md"
          # 统一从 Release 取发布时间:手动 workflow_dispatch 补触发时
          # github.event.release.* 全为空,直接引用会写出 publishedAt 为空串的元数据。
          PUBLISHED_AT=$(gh release view "$TAG" --repo "${{ github.repository }}" \
            --json publishedAt -q .publishedAt)
          echo "PUBLISHED_AT=$PUBLISHED_AT" >> "$GITHUB_ENV"
          ls -lh ./dl

      # 记下 R2 上当前指向的版本,留到最后再删 —— 先删后传会留出一个
      # 「latest.json 指向的对象已不存在」的窗口。
      - name: 记录 R2 上的前一版本
        if: steps.gate.outputs.skip != 'true'
        id: prev
        run: |
          # 两平台各记各的。macOS 的发布起步晚于 Windows,latest-mac.json 在首次 mac 发布前
          # 并不存在;共用一个 PREV 会拿 Windows 的版本号去删压根不存在的 mac 对象(无害),
          # 或反过来在 mac 落后一版时误删仍在服役的 mac 包(有害)。
          PREV=$(curl -fsSL "${R2_BASE_URL}/latest.json" 2>/dev/null | jq -r '.version // empty' 2>/dev/null || echo "")
          PREV_MAC=$(curl -fsSL "${R2_BASE_URL}/latest-mac.json" 2>/dev/null | jq -r '.version // empty' 2>/dev/null || echo "")
          PREV_LINUX=$(curl -fsSL "${R2_BASE_URL}/latest-linux.json" 2>/dev/null | jq -r '.version // empty' 2>/dev/null || echo "")
          echo "previous on R2: win=${PREV:-<none>} mac=${PREV_MAC:-<none>} linux=${PREV_LINUX:-<none>}"
          echo "version=$PREV" >> "$GITHUB_OUTPUT"
          echo "mac_version=$PREV_MAC" >> "$GITHUB_OUTPUT"
          echo "linux_version=$PREV_LINUX" >> "$GITHUB_OUTPUT"

      # 上传顺序是契约:先 exe 后 latest.json。json 是开关,反过来会让客户端
      # 看到新版本却下载到 404(dev.ps1:1181 同款约定)。
      - name: 上传安装包到 R2
        if: steps.gate.outputs.skip != 'true'
        run: |
          wrangler r2 object put --remote "$R2_BUCKET/WindInput-Setup-${VERSION}.exe" \
            --file "./dl/WindInput-Setup-${VERSION}.exe" \
            --content-type "application/octet-stream"
          wrangler r2 object put --remote "$R2_BUCKET/WindInput-Setup-${VERSION}.exe.sha256" \
            --file "./dl/WindInput-Setup-${VERSION}.exe.sha256" \
            --content-type "text/plain; charset=utf-8"

      - name: 上传发布说明到 R2
        if: steps.gate.outputs.skip != 'true'
        run: |
          wrangler r2 object put --remote "$R2_BUCKET/WindInput-${VERSION}-Release.md" \
            --file "./dl/WindInput-${VERSION}-Release.md" \
            --content-type "text/markdown; charset=utf-8"

      # 字段契约见 wind-setting/docs/online-update-plan.md §3.2,与 dev.ps1 的
      # New-UpdateManifest 保持一致。sha256/size 为必填且必须真实 —— 客户端在缺失或
      # 不匹配时拒绝升级,不退化为「不校验就装」(旧 Go 版 size 恒为 0,导致 %TEMP% 里
      # 一个被截断的同名文件会被当成完整包安装)。size 必须是 JSON 数字而非字符串,
      # 故用 jq --argjson 构造。
      - name: 生成并上传 latest.json
        if: steps.gate.outputs.skip != 'true'
        run: |
          EXE="./dl/WindInput-Setup-${VERSION}.exe"
          SHA=$(awk '{print $1}' "./dl/WindInput-Setup-${VERSION}.exe.sha256")
          SIZE=$(stat -c %s "$EXE")
          # sidecar 与实际产物不符说明 Release 资产被动过,宁可发布失败也不能发出错误校验值
          ACTUAL=$(sha256sum "$EXE" | awk '{print $1}')
          if [ "$SHA" != "$ACTUAL" ]; then
            echo "ERROR: sha256 sidecar($SHA) 与安装包实际值($ACTUAL) 不符" >&2
            exit 1
          fi
          jq -n \
            --arg version "$VERSION" \
            --arg tag "$TAG" \
            --arg exeUrl "${R2_BASE_URL}/WindInput-Setup-${VERSION}.exe" \
            --arg sha256 "$SHA" \
            --argjson size "$SIZE" \
            --arg releaseNotesUrl "${R2_BASE_URL}/WindInput-${VERSION}-Release.md" \
            --arg publishedAt "$PUBLISHED_AT" \
            '{version: $version, tag: $tag, channel: "stable", exeUrl: $exeUrl,
              sha256: $sha256, size: $size, releaseNotesUrl: $releaseNotesUrl,
              publishedAt: $publishedAt}' > latest.json
          cat latest.json
          wrangler r2 object put --remote "$R2_BUCKET/latest.json" \
            --file latest.json \
            --content-type "application/json; charset=utf-8"

      # macOS:同样的契约,只是安装包字段叫 pkgUrl 而非 exeUrl —— 两平台各用各的键,
      # 让「客户端读到另一平台的元数据」这类串档在解析阶段就被拒,而不是下完才发现装不上
      # (客户端侧的对应实现见 wind-setting src/update/mod.rs 的 Artifact)。
      # 发布说明两平台共用同一份 md,不重复上传。
      - name: macOS - 上传安装包与 latest-mac.json
        if: steps.gate.outputs.skip != 'true' && steps.dl.outputs.mac == 'true'
        run: |
          PKG="./dl/WindInput-${VERSION}-macOS.pkg"
          SHA=$(awk '{print $1}' "$PKG.sha256")
          ACTUAL=$(sha256sum "$PKG" | awk '{print $1}')
          if [ "$SHA" != "$ACTUAL" ]; then
            echo "ERROR: sha256 sidecar($SHA) 与安装包实际值($ACTUAL) 不符" >&2
            exit 1
          fi
          SIZE=$(stat -c %s "$PKG")
          # 顺序同 Windows:先传包,后传 json。json 是开关,反过来会让客户端看到新版本却下到 404。
          wrangler r2 object put --remote "$R2_BUCKET/WindInput-${VERSION}-macOS.pkg" \
            --file "$PKG" --content-type "application/octet-stream"
          wrangler r2 object put --remote "$R2_BUCKET/WindInput-${VERSION}-macOS.pkg.sha256" \
            --file "$PKG.sha256" --content-type "text/plain; charset=utf-8"
          jq -n \
            --arg version "$VERSION" \
            --arg tag "$TAG" \
            --arg pkgUrl "${R2_BASE_URL}/WindInput-${VERSION}-macOS.pkg" \
            --arg sha256 "$SHA" \
            --argjson size "$SIZE" \
            --arg releaseNotesUrl "${R2_BASE_URL}/WindInput-${VERSION}-Release.md" \
            --arg publishedAt "$PUBLISHED_AT" \
            '{version: $version, tag: $tag, channel: "stable", pkgUrl: $pkgUrl,
              sha256: $sha256, size: $size, releaseNotesUrl: $releaseNotesUrl,
              publishedAt: $publishedAt}' > latest-mac.json
          cat latest-mac.json
          wrangler r2 object put --remote "$R2_BUCKET/latest-mac.json" \
            --file latest-mac.json --content-type "application/json; charset=utf-8"

      # Linux:同样的契约(先传包后传 json),元数据按架构给出。键名 debs 与 exeUrl / pkgUrl 都不同,
      # 客户端读到别的平台的元数据在解析阶段就会被拒。目前客户端侧还没有 Linux 在线升级的消费方
      # (升级走 apt / 手动下载),这份 json 先作为官网下载页与后续升级功能的数据源,并用来记「R2 上
      # 当前指向哪个版本」,让下面的清理步骤能删旧包。
      - name: Linux - 上传安装包与 latest-linux.json
        if: steps.gate.outputs.skip != 'true' && steps.dl.outputs.linux == 'true'
        run: |
          DEBS='{}'
          for ARCH in amd64 arm64; do
            F="WindInput-${VERSION}-linux-${ARCH}.deb"
            SHA=$(awk '{print $1}' "./dl/$F.sha256")
            ACTUAL=$(sha256sum "./dl/$F" | awk '{print $1}')
            if [ "$SHA" != "$ACTUAL" ]; then
              echo "ERROR: $F 的 sha256 sidecar($SHA) 与实际值($ACTUAL) 不符" >&2
              exit 1
            fi
            SIZE=$(stat -c %s "./dl/$F")
            wrangler r2 object put --remote "$R2_BUCKET/$F" --file "./dl/$F" \
              --content-type "application/vnd.debian.binary-package"
            wrangler r2 object put --remote "$R2_BUCKET/$F.sha256" --file "./dl/$F.sha256" \
              --content-type "text/plain; charset=utf-8"
            DEBS=$(jq -c --arg a "$ARCH" --arg url "${R2_BASE_URL}/$F" --arg sha "$SHA" --argjson size "$SIZE" \
              '. + {($a): {url: $url, sha256: $sha, size: $size}}' <<<"$DEBS")
          done
          # rpm(试验性):键 rpms 按 rpm 的架构名(x86_64 / aarch64)给出,与 debs 并列。
          # 没有 rpm 时不写这个键(客户端与下载页都按「缺失 = 不提供」处理)。
          RPMS='{}'
          if [ "${{ steps.dl.outputs.rpm }}" = "true" ]; then
            for ARCH in x86_64 aarch64; do
              F="WindInput-${VERSION}-linux-${ARCH}.rpm"
              SHA=$(awk '{print $1}' "./dl/$F.sha256")
              ACTUAL=$(sha256sum "./dl/$F" | awk '{print $1}')
              if [ "$SHA" != "$ACTUAL" ]; then
                echo "ERROR: $F 的 sha256 sidecar($SHA) 与实际值($ACTUAL) 不符" >&2
                exit 1
              fi
              SIZE=$(stat -c %s "./dl/$F")
              wrangler r2 object put --remote "$R2_BUCKET/$F" --file "./dl/$F" \
                --content-type "application/x-rpm"
              wrangler r2 object put --remote "$R2_BUCKET/$F.sha256" --file "./dl/$F.sha256" \
                --content-type "text/plain; charset=utf-8"
              RPMS=$(jq -c --arg a "$ARCH" --arg url "${R2_BASE_URL}/$F" --arg sha "$SHA" --argjson size "$SIZE" \
                '. + {($a): {url: $url, sha256: $sha, size: $size}}' <<<"$RPMS")
            done
          fi
          jq -n \
            --arg version "$VERSION" \
            --arg tag "$TAG" \
            --argjson debs "$DEBS" \
            --argjson rpms "$RPMS" \
            --arg releaseNotesUrl "${R2_BASE_URL}/WindInput-${VERSION}-Release.md" \
            --arg publishedAt "$PUBLISHED_AT" \
            '{version: $version, tag: $tag, channel: "stable", debs: $debs}
              + (if ($rpms | length) > 0 then {rpms: $rpms} else {} end)
              + {releaseNotesUrl: $releaseNotesUrl, publishedAt: $publishedAt}' > latest-linux.json
          cat latest-linux.json
          wrangler r2 object put --remote "$R2_BUCKET/latest-linux.json" \
            --file latest-linux.json --content-type "application/json; charset=utf-8"

      - name: 校验 R2 公开地址可达
        if: steps.gate.outputs.skip != 'true'
        run: |
          set -e
          EXPECTED_EXE_SIZE=$(stat -c %s "./dl/WindInput-Setup-${VERSION}.exe")
          check() {
            local url="$1" expected_size="$2" attempt=0 headers actual
            echo "Verifying: $url"
            while [ $attempt -lt 6 ]; do
              attempt=$((attempt + 1))
              if headers=$(curl -fsSL -I "$url" 2>&1); then
                if [ -z "$expected_size" ]; then
                  echo "OK: reachable"; return 0
                fi
                actual=$(printf '%s\n' "$headers" \
                  | awk 'BEGIN{IGNORECASE=1} /^content-length:/ {gsub(/\r/,""); print $2}' | tail -n1)
                if [ "$actual" = "$expected_size" ]; then
                  echo "OK: size matches ($actual bytes)"; return 0
                fi
                echo "Size mismatch: expected=$expected_size actual=$actual, retrying..."
              else
                echo "HEAD failed (attempt $attempt/6), retrying in 5s..."
              fi
              sleep 5
            done
            echo "ERROR: $url 六次尝试后仍不可达或大小不符" >&2
            return 1
          }
          check "${R2_BASE_URL}/WindInput-Setup-${VERSION}.exe" "$EXPECTED_EXE_SIZE"
          check "${R2_BASE_URL}/WindInput-Setup-${VERSION}.exe.sha256" ""
          check "${R2_BASE_URL}/WindInput-${VERSION}-Release.md" ""
          check "${R2_BASE_URL}/latest.json" ""
          if [ "${{ steps.dl.outputs.mac }}" = "true" ]; then
            EXPECTED_PKG_SIZE=$(stat -c %s "./dl/WindInput-${VERSION}-macOS.pkg")
            check "${R2_BASE_URL}/WindInput-${VERSION}-macOS.pkg" "$EXPECTED_PKG_SIZE"
            check "${R2_BASE_URL}/WindInput-${VERSION}-macOS.pkg.sha256" ""
            check "${R2_BASE_URL}/latest-mac.json" ""
          fi
          if [ "${{ steps.dl.outputs.linux }}" = "true" ]; then
            for ARCH in amd64 arm64; do
              F="WindInput-${VERSION}-linux-${ARCH}.deb"
              check "${R2_BASE_URL}/$F" "$(stat -c %s "./dl/$F")"
              check "${R2_BASE_URL}/$F.sha256" ""
            done
            if [ "${{ steps.dl.outputs.rpm }}" = "true" ]; then
              for ARCH in x86_64 aarch64; do
                F="WindInput-${VERSION}-linux-${ARCH}.rpm"
                check "${R2_BASE_URL}/$F" "$(stat -c %s "./dl/$F")"
                check "${R2_BASE_URL}/$F.sha256" ""
              done
            fi
            check "${R2_BASE_URL}/latest-linux.json" ""
          fi
          echo "R2 对象全部校验通过。"

      # 校验通过后才清理旧版本,失败时旧版本原样留着仍可下载。
      # 只删按当前命名口径拼出的对象;更早的 Go 版遗留对象(WindInput-<版本>-Setup.exe)
      # 命名不同,不会被误删,需要时手工清理。
      - name: 清理 R2 上的旧版本对象
        if: steps.gate.outputs.skip != 'true'
        env:
          PREV_VERSION: ${{ steps.prev.outputs.version }}
          PREV_MAC: ${{ steps.prev.outputs.mac_version }}
          MAC_SYNCED: ${{ steps.dl.outputs.mac }}
          PREV_LINUX: ${{ steps.prev.outputs.linux_version }}
          LINUX_SYNCED: ${{ steps.dl.outputs.linux }}
        run: |
          # macOS / Linux 侧此刻指向的版本:本次同步了就是新版本,没同步则仍是原来那个。
          if [ "$MAC_SYNCED" = "true" ]; then MAC_CUR="$VERSION"; else MAC_CUR="$PREV_MAC"; fi
          if [ "$LINUX_SYNCED" = "true" ]; then LINUX_CUR="$VERSION"; else LINUX_CUR="$PREV_LINUX"; fi

          if [ -n "$PREV_VERSION" ] && [ "$PREV_VERSION" != "$VERSION" ]; then
            echo "清理 Windows 旧版本: $PREV_VERSION"
            wrangler r2 object delete --remote "$R2_BUCKET/WindInput-Setup-${PREV_VERSION}.exe" || true
            wrangler r2 object delete --remote "$R2_BUCKET/WindInput-Setup-${PREV_VERSION}.exe.sha256" || true
            # 发布说明各平台共用同一份。mac / Linux 元数据还指着它时不能删 ——
            # 各平台版本可能不同步(比如某次只发了 Windows),删了对方用户的「更新说明」就 404。
            if [ "$MAC_CUR" = "$PREV_VERSION" ] || [ "$LINUX_CUR" = "$PREV_VERSION" ]; then
              echo "  发布说明 $PREV_VERSION 仍被其它平台元数据引用,保留"
            else
              wrangler r2 object delete --remote "$R2_BUCKET/WindInput-${PREV_VERSION}-Release.md" || true
            fi
          else
            echo "Windows: 无需清理(前一版本为 ${PREV_VERSION:-<none>})"
          fi

          # 只有本次确实推了新 mac 包,才轮得到清旧 mac 包。
          if [ "$MAC_SYNCED" = "true" ] && [ -n "$PREV_MAC" ] && [ "$PREV_MAC" != "$VERSION" ]; then
            echo "清理 macOS 旧版本: $PREV_MAC"
            wrangler r2 object delete --remote "$R2_BUCKET/WindInput-${PREV_MAC}-macOS.pkg" || true
            wrangler r2 object delete --remote "$R2_BUCKET/WindInput-${PREV_MAC}-macOS.pkg.sha256" || true
          else
            echo "macOS: 无需清理(本次同步=${MAC_SYNCED:-false}, 前一版本=${PREV_MAC:-<none>})"
          fi

          # Linux:同 macOS,本次确实推了新包才清旧包。
          if [ "$LINUX_SYNCED" = "true" ] && [ -n "$PREV_LINUX" ] && [ "$PREV_LINUX" != "$VERSION" ]; then
            echo "清理 Linux 旧版本: $PREV_LINUX"
            for ARCH in amd64 arm64; do
              wrangler r2 object delete --remote "$R2_BUCKET/WindInput-${PREV_LINUX}-linux-${ARCH}.deb" || true
              wrangler r2 object delete --remote "$R2_BUCKET/WindInput-${PREV_LINUX}-linux-${ARCH}.deb.sha256" || true
            done
            # 旧版若没发过 rpm,删不存在的对象只是 || true 吞掉的无害失败。
            for ARCH in x86_64 aarch64; do
              wrangler r2 object delete --remote "$R2_BUCKET/WindInput-${PREV_LINUX}-linux-${ARCH}.rpm" || true
              wrangler r2 object delete --remote "$R2_BUCKET/WindInput-${PREV_LINUX}-linux-${ARCH}.rpm.sha256" || true
            done
          else
            echo "Linux: 无需清理(本次同步=${LINUX_SYNCED:-false}, 前一版本=${PREV_LINUX:-<none>})"
          fi

  winget:
    name: 提交 winget 清单
    if: ${{ !inputs.r2_only }}
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      HAS_TOKEN: ${{ secrets.WINGET_TOKEN != '' && 'true' || 'false' }}
      PRERELEASE: ${{ github.event.release.prerelease || false }}
    steps:
      # komac update 以 winget-pkgs 里的上一版为模板,只换 URL / 哈希 / 版本 —— 所以包必须
      # 已经在库里;首次入库走 scripts/pkg-managers/winget-manifest.sh 手工提交。
      - name: 检查前置条件
        id: gate
        run: |
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ "$HAS_TOKEN" != "true" ]; then
            echo "::warning::未配置 secrets.WINGET_TOKEN,跳过 winget 提交。"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          # 预发布不进 winget:winget 没有渠道概念,提交了就会被所有 `winget upgrade` 拉到。
          # 带 '-' 的版本号(0.124.1-beta.2 之类)同理,即便 Release 忘了勾 pre-release。
          elif [ "$PRERELEASE" = "true" ] || [[ "$VERSION" == *-* ]]; then
            echo "::notice::$TAG 是预发布版本,不提交 winget。"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # 下载地址用官网下载网关 dl.windinput.com(国内快):网关 302 到国内镜像或 R2;R2 只留最新
      # 一版(见上面的清理步骤),R2 上已清掉的旧版由网关回落 GitHub Releases 的同名资产
      # (WindInputSite/worker),所以 winget-pkgs 定期回测历史版本 URL 时不会 404。三处出口是
      # 同一个文件,哈希一致。也因此本 job 不必等 R2 同步完成:还没传上去时网关同样回落 GitHub。
      #
      # 直接跑 komac 而不用 winget-releaser:后者只认 GitHub Release 资产的 URL。
      # komac 下载这个地址算哈希,以库里上一版为模板生成清单,向 microsoft/winget-pkgs 提 PR
      # (从 token 所属账号的 fork 发出,没有 fork 会自动建)。
      - name: 提交到 winget-pkgs
        if: steps.gate.outputs.skip != 'true'
        env:
          KOMAC_VERSION: 2.16.0
          KOMAC_SHA256: 7d2707fa6210f2789a3702de49fbd150b736dbf426ee0b9bc8e098736f9fd82d
          GITHUB_TOKEN: ${{ secrets.WINGET_TOKEN }}
          VERSION: ${{ steps.gate.outputs.version }}
        run: |
          set -euo pipefail
          F="komac-${KOMAC_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          curl -fsSL -o "$F" "https://github.com/russellbanks/Komac/releases/download/v${KOMAC_VERSION}/$F"
          echo "${KOMAC_SHA256}  $F" | sha256sum -c -
          tar -xzf "$F" komac
          ./komac update WindInput.WindInput \
            --version "$VERSION" \
            --urls "https://dl.windinput.com/WindInput-Setup-${VERSION}.exe" \
            --release-notes-url "https://github.com/${{ github.repository }}/releases/tag/${TAG}" \
            --submit

  # 自有桶 huanfeng/scoop-bucket 的 Excavator 定时任务已被 GitHub 以长期无活动停用,不能指望它按
  # checkver 自动跟进,故由这里主动通知。对端 update-installer-manifest.yml 只改 version/url/hash:
  # URL 按桶内清单自己的 autoupdate 模板生成,哈希由对端下载后自算,这里只报版本号。
  # 官方 Nonportable 桶(若收录)由其机器人按 checkver/autoupdate 跟进,与此无关。
  scoop:
    name: 通知 Scoop 桶
    if: ${{ !inputs.r2_only }}
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      PRERELEASE: ${{ github.event.release.prerelease || false }}
      TOKEN: ${{ secrets.SCOOP_TOKEN }}
    steps:
      - name: 发送 repository_dispatch
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          if [ -z "$TOKEN" ]; then
            echo "::warning::未配置 secrets.SCOOP_TOKEN,跳过 Scoop 桶更新。"
            exit 0
          fi
          # 与 winget 同一条判据:Scoop 同样没有渠道概念,预发布不进桶。
          if [ "$PRERELEASE" = "true" ] || [[ "$VERSION" == *-* ]]; then
            echo "::notice::$TAG 是预发布版本,不更新 Scoop 桶。"
            exit 0
          fi
          jq -n --arg version "$VERSION" \
            '{event_type: "update-installer-manifest", client_payload: {app: "windinput-np", version: $version}}' \
            | curl -fsS -X POST \
                -H "Accept: application/vnd.github+json" \
                -H "Authorization: Bearer $TOKEN" \
                "https://api.github.com/repos/huanfeng/scoop-bucket/dispatches" \
                --data-binary @-
          echo "已通知 huanfeng/scoop-bucket 更新 windinput-np 到 $VERSION"
