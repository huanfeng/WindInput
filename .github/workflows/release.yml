name: Release

# 双平台发布。两种触发:
#   - push tag v*        → 产出草稿 Release(附 Windows Setup.exe/Portable.zip + macOS .pkg + .sha256)
#   - workflow_dispatch  → 只产出可测 artifact(不发 Release),供合并前双平台实测
#
# 作业编排(为什么是四个 job 而不是一个):
#   prep           → 定版本号。两平台的产物文件名都带版本,必须同源一次算出;各自算会在
#                    手动触发时因 sha 截取口径漂移而产出对不上号的两套文件名。
#   build-windows  → windows-2022 原生 MSVC,产 Setup.exe + Portable.zip
#   build-macos    → macos-14,产通用二进制(arm64+x86_64) .pkg
#   publish        → 汇总两边 artifact,建**一个**草稿 Release
#
# ⚠️ 创建 Release 必须收口到单个 job。softprops/action-gh-release 是「先查是否存在、
#   不存在则创建」,两个 build job 各自调它就是标准的 TOCTOU —— 并发下会建出两个草稿,
#   或后者的 body 覆盖前者。这也是本文件从「一个 job 干完」改成四个 job 的原因。
#
# 为何 Windows 用 windows-2022 原生 MSVC,而非过去的 ubuntu 交叉编译(clang + lld-link + xwin):
#   交叉编产出的 wind_tsf.dll 虽 PE 安全元数据(DllCharacteristics/SafeSEH)与原生 MSVC
#   逐位一致、也能独立 LoadLibrary,却在部分启用进程级缓解策略的宿主中 COM 激活失败 ——
#   差异落在工具链代码生成层(clang vs cl.exe),静态审计无法穷尽。TSF DLL 会被注入任意
#   第三方宿主进程,故【发布产物】必须由与生态一致的原生 MSVC 构建。CI 门禁(ci.yml)仍用
#   ubuntu + xwin 交叉编译做快速校验(只验能否编过),不受影响。
#
# 兄弟仓检出已不再需要 PAT:wind-installer / wind-portable / wind-ui-rust 均已开源,
# 用 actions/checkout 默认的 GITHUB_TOKEN 即可拉取。仅设置程序 wind-setting 仍是私有仓 ——
# 它与 wind-ui-rust 的检出绑在一起,按 secrets.WIND_REPOS_TOKEN 是否配置来开关
# (wind-ui-rust 只是 wind-setting 的 path 依赖;installer/portable 用 crates.io 上的
#  windui,不看本地仓,故不检出 wind-setting 时也没必要拉它):
#   配了(本仓)    → 正常检出,产物含设置程序;检出失败即中止,不会静默少东西。
#   没配(fork 等) → 跳过检出并告警。dev.ps1 / mac 的 dev.sh 本就把设置程序当可选模块
#                   (仓库不存在则跳过),故构建照常完成,只是产物里没有 wind_setting。
# 于是 fork 既能跑 CI,也能跑通完整的发版流程。
on:
  push:
    tags: ['v*']
  workflow_dispatch: {}     # 手动触发:走完整打包,只产出可测 artifact,不发 Release

permissions:
  contents: read            # 默认只读;仅 publish job 提权到 write

jobs:
  # ───────────────────────── 版本号唯一真值源 ─────────────────────────
  prep:
    name: 确定版本号
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      # tag 为发布版本的唯一真值源;两个 build job 都把它写进 docs/VERSION,让下游
      # (build.rs 资源版本 / dev.ps1 / CMake -DAPP_VERSION_STR / mac app_build 的 PlistBuddy)
      # 统一取到同一个值。
      - id: v
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            V="${GITHUB_REF_NAME#v}"
          else
            V="$(tr -d '[:space:]' < docs/VERSION)-dev.${GITHUB_SHA:0:8}"   # 手动触发:开发占位版本
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "build version = $V"

  # ───────────────────────── Windows ─────────────────────────
  build-windows:
    name: Windows 安装包
    needs: prep
    # 钉死 windows-2022(自带 VS2022 Enterprise + C++)。不用 windows-latest ——
    # 它是滚动标签,现已指向 windows-2025-vs2026(装 VS2026),而 dev.ps1 的 CMake
    # 生成器硬编码 "Visual Studio 17 2022",在无 VS2022 的机器上会「找不到任何 VS 实例」。
    # 且本次原生化的目的正是与生态一致的 VS2022(用户机普遍 VS2022,VS2026 过新)。
    runs-on: windows-2022
    env:
      BUILD_VERSION: ${{ needs.prep.outputs.version }}
      # secrets 上下文在 step 的 if: 里不可用,只能在 job 级 env 里先求值。
      # 这里存的是布尔结果而非 token 本身,避免把密文散布到每个 step 的环境变量里。
      HAS_SETTING_TOKEN: ${{ secrets.WIND_REPOS_TOKEN != '' && 'true' || 'false' }}
    steps:
      # 多仓库需为同级目录:dev.ps1 用 ../wind-installer / ../wind-portable;
      # wind-setting 另需 ../wind-ui-rust 与 ../WindInput。均 checkout 到 $GITHUB_WORKSPACE 下平级。
      # 下面三个仓已开源,checkout 走默认 GITHUB_TOKEN,无需额外 PAT。
      - name: 检出 WindInput
        uses: actions/checkout@v4
        with:
          path: WindInput
      - name: 检出 wind-installer
        uses: actions/checkout@v4
        with:
          repository: huanfeng/wind-installer
          path: wind-installer
      - name: 检出 wind-portable
        uses: actions/checkout@v4
        with:
          repository: huanfeng/wind-portable
          path: wind-portable

      # 设置程序仍是私有仓:配了 PAT 才检出,失败即中止(不允许官方发版悄悄少个设置程序);
      # 没配则整步跳过,Build-Setting 会因 ../wind-setting 不存在而自行跳过。
      #
      # wind-ui-rust 同组门控:它只被 wind-setting 以 path 依赖引用
      # (windui = { path = "../wind-ui-rust" });wind-installer / wind-portable 依赖的是
      # crates.io 上发布的 windui,不看本地仓 —— 故不检出 wind-setting 时拉它纯属白拉。
      - name: 检出 wind-ui-rust (wind-setting 的 path 依赖)
        if: env.HAS_SETTING_TOKEN == 'true'
        uses: actions/checkout@v4
        with:
          repository: huanfeng/wind-ui-rust
          path: wind-ui-rust
      - name: 检出 wind-setting (私有仓,需 WIND_REPOS_TOKEN)
        if: env.HAS_SETTING_TOKEN == 'true'
        uses: actions/checkout@v4
        with:
          repository: huanfeng/wind-setting
          path: wind-setting
          token: ${{ secrets.WIND_REPOS_TOKEN }}
      - name: 提示跳过设置程序
        if: env.HAS_SETTING_TOKEN != 'true'
        run: echo "::warning::未配置 secrets.WIND_REPOS_TOKEN,跳过私有仓 wind-setting(及其 path 依赖 wind-ui-rust);本次产物不含设置程序 wind_setting.exe。"

      # windows-2022 镜像自带 VS2022(含 C++ 工具链)+ CMake + Rust(stable-msvc),
      # 故不再需要 clang/lld/xwin。仍显式钉 Rust stable 以稳定缓存键与工具链版本。
      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          # workspaces 是单一多行输入,没法条件性增删某一行;留空行的行为未经验证
          # (很可能被解析成仓库根),故 wind-setting / wind-ui-rust 缺席时改成重复列一次
          # 主仓工作区 —— 重复项对缓存键无副作用,比赌空行的解析行为稳。
          workspaces: |
            WindInput/wind_input
            wind-installer
            wind-portable
            ${{ env.HAS_SETTING_TOKEN == 'true' && 'wind-ui-rust' || 'WindInput/wind_input' }}
            ${{ env.HAS_SETTING_TOKEN == 'true' && 'wind-setting' || 'WindInput/wind_input' }}

      - name: 写入 docs/VERSION
        shell: bash
        working-directory: WindInput
        run: printf '%s' "$BUILD_VERSION" > docs/VERSION

      # dev.ps1 8  = 全构建(wind_input + tsf x64/x86 + setting + portable + 词库数据)
      #              + 调 wind-installer\scripts\pack.ps1 打包 → WindInput\dist\WindInput-Setup-<版本>.exe
      #              (+ .sha256 sidecar + 在线升级 manifest,由 New-UpdateManifest 生成)
      - name: 构建并打包安装程序(原生 MSVC)
        shell: pwsh
        working-directory: WindInput
        run: .\scripts\dev.ps1 8

      # dev.ps1 9s = 复用上一步的 build/ 产出便携 zip(skip 全构建)→ WindInput\dist\WindInput-Portable-<版本>.zip(+ .sha256)
      - name: 打包便携版压缩包
        shell: pwsh
        working-directory: WindInput
        run: .\scripts\dev.ps1 9s

      - name: 上传 Windows 产物
        uses: actions/upload-artifact@v4
        with:
          name: dist-windows
          path: |
            WindInput/dist/WindInput-Setup-*.exe
            WindInput/dist/WindInput-Setup-*.exe.sha256
            WindInput/dist/WindInput-Portable-*.zip
            WindInput/dist/WindInput-Portable-*.zip.sha256
          if-no-files-found: error
          retention-days: 14

  # ───────────────────────── macOS ─────────────────────────
  build-macos:
    name: macOS 安装包
    needs: prep
    # macos-14 是 Apple Silicon runner。x86_64 那半靠 rustup 的交叉 target + Swift 的
    # --arch 双架构编译,不需要 Intel runner。
    runs-on: macos-14
    # 兜底闸: 双架构 Rust + 双架构 Swift + 下载组装词库, 正常一小时内完事。
    # 不设的话默认是 6 小时, 而 macOS runner 按 10 倍分钟计费, 卡住一次就很难看。
    timeout-minutes: 90
    env:
      BUILD_VERSION: ${{ needs.prep.outputs.version }}
      WIND_MAC_UNIVERSAL: '1'          # app / service / 设置 app 三者统一产 arm64+x86_64
      HAS_SETTING_TOKEN: ${{ secrets.WIND_REPOS_TOKEN != '' && 'true' || 'false' }}
    steps:
      # 目录布局同 Windows:wind-setting 以 path 依赖引用 ../wind-ui-rust,并需要 ../WindInput。
      # macOS 侧不需要 wind-installer / wind-portable(打包由 scripts/mac/dev.sh 的 pkgbuild 完成)。
      - name: 检出 WindInput
        uses: actions/checkout@v4
        with:
          path: WindInput
      # 同 Windows 侧:私有仓,有 PAT 才检出;没有则 build_setting 自行跳过,.pkg 不含设置 app。
      # wind-ui-rust 是 wind-setting 的 path 依赖,同组门控 —— macOS 侧它没有别的消费者。
      - name: 检出 wind-ui-rust (wind-setting 的 path 依赖)
        if: env.HAS_SETTING_TOKEN == 'true'
        uses: actions/checkout@v4
        with:
          repository: huanfeng/wind-ui-rust
          path: wind-ui-rust
      - name: 检出 wind-setting (私有仓,需 WIND_REPOS_TOKEN)
        if: env.HAS_SETTING_TOKEN == 'true'
        uses: actions/checkout@v4
        with:
          repository: huanfeng/wind-setting
          path: wind-setting
          token: ${{ secrets.WIND_REPOS_TOKEN }}
      - name: 提示跳过设置程序
        if: env.HAS_SETTING_TOKEN != 'true'
        run: echo "::warning::未配置 secrets.WIND_REPOS_TOKEN,跳过私有仓 wind-setting(及其 path 依赖 wind-ui-rust);本次 .pkg 不含设置 app。"

      # x86_64-apple-darwin 是通用二进制的另一半;缺它 dev.sh 的 cargo_build_universal 会直接失败。
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            WindInput/wind_input
            ${{ env.HAS_SETTING_TOKEN == 'true' && 'wind-ui-rust' || 'WindInput/wind_input' }}
            ${{ env.HAS_SETTING_TOKEN == 'true' && 'wind-setting' || 'WindInput/wind_input' }}

      - name: 写入 docs/VERSION
        working-directory: WindInput
        run: printf '%s' "$BUILD_VERSION" > docs/VERSION

      # 签名身份。**当前默认走 ad-hoc** —— 尚无 Developer ID 证书(需付费 Apple Developer
      # Program)。这一步是为将来留的接线:配上 secrets 即自动切到真证书,无需改 workflow。
      #
      # 必须显式 export SIGN_IDENTITY="" 走 ad-hoc:dev.sh 的 pick_sign_identity 在未设该变量时
      # 会去 security find-identity 挑,CI 上一个都挑不到就回落到自签名 "WindInput Dev",
      # 而那个证书在 runner 上并不存在 → codesign 失败 → 构建中止。
      - name: 准备签名身份
        id: sign
        env:
          # base64 后的 .p12。**签 .app/服务的「Developer ID Application」与签 .pkg 的
          # 「Developer ID Installer」是两张不同的证书**,将来要公证时需把两张一起导出到
          # 同一个 .p12(security import 会把里面的身份全部导入),否则 productsign 会找不到身份。
          CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          if [ -z "$CERT_P12" ]; then
            echo "::warning::未配置 secrets.MACOS_CERT_P12,本次 .pkg 为 ad-hoc 签名、未公证。"
            echo "identity=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PW="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          printf '%s' "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/productsign
          rm -f "$RUNNER_TEMP/cert.p12"
          # 不加这句,codesign 会在拿私钥时报 errSecInternalComponent(钥匙串弹不出授权框的
          # 非交互会话里必然发生)。本机开发遇到同一报错也是同一成因。
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PW" "$KEYCHAIN" >/dev/null
          # 临时钥匙串必须进搜索域,否则 codesign / find-identity 看不见里面的身份。
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          ID="$(security find-identity -v -p codesigning "$KEYCHAIN" | sed -n 's/.*"\(.*\)".*/\1/p' | head -1)"
          [ -n "$ID" ] || { echo "导入了证书却找不到可用于签名的身份" >&2; exit 1; }
          echo "identity=$ID" >> "$GITHUB_OUTPUT"
          echo "签名身份: $ID"

      # dev.sh 8 = pkg_build release --build:cargo(通用) + gen-data(下载词库并组装) +
      #            app_build(Swift 双架构) + build_setting → wind_macos/dist/WindInput-<版本>-macOS.pkg
      # 打包前会逐个 lipo -archs 校验架构齐全,缺一个即拒绝出包。
      - name: 构建并打包 .pkg(通用二进制)
        working-directory: WindInput
        env:
          SIGN_IDENTITY: ${{ steps.sign.outputs.identity }}
          # 以下四项配齐才会 productsign + notarytool + staple;缺任一项 pkg_build 自动跳过。
          MACOS_DEVELOPER_ID_INSTALLER: ${{ secrets.MACOS_DEVELOPER_ID_INSTALLER }}
          MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          MACOS_NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
          MACOS_NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
        run: ./scripts/mac/dev.sh 8

      # 与 Windows 侧口径一致:每个产物配一个同名 .sha256 sidecar。
      # 格式对齐 sha256sum(<hash>␣␣<文件名>),下游校验脚本按第一列取值。
      - name: 生成 sha256 sidecar
        working-directory: WindInput/wind_macos/dist
        run: |
          for f in *.pkg; do
            shasum -a 256 "$f" > "$f.sha256"
            cat "$f.sha256"
          done

      - name: 上传 macOS 产物
        uses: actions/upload-artifact@v4
        with:
          name: dist-macos
          path: |
            WindInput/wind_macos/dist/*.pkg
            WindInput/wind_macos/dist/*.pkg.sha256
          if-no-files-found: error
          retention-days: 14

  # ───────────────────────── 汇总发布 ─────────────────────────
  publish:
    name: 创建草稿 Release
    needs: [prep, build-windows, build-macos]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write          # 仅此 job 需要:创建 Release / 上传产物
    env:
      BUILD_VERSION: ${{ needs.prep.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0       # gen-release-notes.sh 要按历史拓扑找上一个 tag

      - name: 下载两平台产物
        uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist

      - name: 核对产物齐全
        run: |
          ls -lh dist
          # 少了任何一个都说明某个 build job 悄悄产出了空目录 —— 与其发一个缺平台的
          # Release,不如在这里失败。
          for pat in "WindInput-Setup-*.exe" "WindInput-Portable-*.zip" "*.pkg"; do
            # shellcheck disable=SC2086
            ls dist/$pat >/dev/null 2>&1 || { echo "缺产物: $pat" >&2; exit 1; }
          done

      # Windows 产物在 CI 上【必然未签名】—— 云签名的会话要做二次验证、只活 2 小时、
      # 还需要一个本地客户端进程,托管 runner 上做不到。详见 docs/design/code-signing.md。
      #
      # 这一步不做拦截,只如实把结论写进 Release 正文:草稿 Release 本就要人工过目,
      # 与其在这里硬失败让整条发布链断掉(macOS 那半是好的),不如把「这批 Windows 包
      # 未签名、发布前需用本机 dev.ps1 8/9 产的签名版替换」直接顶在正文里。
      #
      # 判据是 PE 的 Security 目录项非零,不是「签名有效」—— 后者要验证书链,ubuntu 上
      # 做不到,而前者足以区分「签过」与「根本没签」,这正是要防的。
      - name: 标注 Windows 产物签名状态
        id: signcheck
        run: |
          if python3 scripts/check-signed.py dist/WindInput-Setup-*.exe; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Windows 安装包未签名(CI 无法签名,属预期)。发布前请用本机 dev.ps1 sign 8 / sign 9s 产的签名版替换。"
          fi

      # 本仓绝大多数改动直接提交、不走 PR,GitHub 的 generate_release_notes 只会产出空的
      # "What's Changed",故改为自行按 conventional commits 汇总。
      - name: 生成 Release Notes
        run: ./scripts/gen-release-notes.sh --tag "$GITHUB_REF_NAME" -o release_notes.md

      # 未签名的横幅顶在正文最前面。草稿 Release 要人工审核后才发布,横幅在那一刻必须
      # 一眼可见 —— 塞在文末等于没有。产物换成签名版后,把这段删掉再发布。
      - name: 未签名产物横幅
        if: steps.signcheck.outputs.signed != 'true'
        run: |
          {
            echo "> [!WARNING]"
            echo "> **本 Release 的 Windows 产物由 CI 构建,未经代码签名** —— 用户安装时会看到"
            echo "> SmartScreen 的「未知发布者」警告。"
            echo ">"
            echo "> 发布前请在开发机上执行(需先建立签名会话):"
            echo "> \`.\\scripts\\dev.ps1 sign 8\` + \`.\\scripts\\dev.ps1 sign 9s\` + \`.\\scripts\\dev.ps1 verify-sign\`,"
            echo "> (sign 是开关, 漏写就还是一套未签名的包)"
            echo "> 用 \`dist\\\` 下的签名产物替换本页的 Setup.exe 与 Portable.zip(连同各自的 .sha256),"
            echo "> 然后删掉这段提示再点发布。"
            echo ">"
            echo "> 为什么 CI 签不了:docs/design/code-signing.md 第 3 节。"
            echo ""
            cat release_notes.md
          } > release_notes.tmp && mv release_notes.tmp release_notes.md

      - name: 创建草稿 Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true                          # 人工审核 Release Notes 后再发布
          name: 清风输入法 v${{ env.BUILD_VERSION }}
          # 正文里的 user-facing 标记块是给人填的:发布前把面向用户的更新说明写进标记内。
          # 两个下游按此标记取内容 —— 文档仓 scripts/sync_release_notes.py(→ 官网更新记录)
          # 与 wind-setting src/update/notes.rs(→ 应用内升级提示),保持"暂未填写"占位则两边都跳过。
          body_path: release_notes.md
          files: dist/*
