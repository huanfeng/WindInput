name: CI

# push/PR 门禁:全程 ubuntu-latest 交叉编译校验(无需 Windows runner)。
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    # 整个工作区的测试二进制很多，带完整调试信息会把 runner 磁盘写满（链接时 ld 被 Bus error）；
    # CI 里不需要调试符号，只留行号表。
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      # runner 预装的 .NET / Android SDK / GHC 用不到（Android 只做 cargo check，不要 NDK），腾出十几 GB。
      - name: 腾出磁盘
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: actions/checkout@v7

      # 统一 MSVC 工具链:clang-19(C++ TSF 需 clang≥19)+ lld-19 + llvm-19;
      # cargo-xwin 交叉编 Rust、clang 交叉编 C++ TSF,均经 MSVC SDK(无需 mingw)。
      - name: 安装 clang-19/lld-19/llvm-19
        run: sudo apt-get update && sudo apt-get install -y clang-19 lld-19 llvm-19

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc, aarch64-linux-android
          components: rustfmt, clippy

      - name: 安装 cargo-xwin
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-xwin

      # 缓存 MSVC CRT/Windows SDK(xwin 首次下载约数百 MB)
      - name: 缓存 xwin SDK
        uses: actions/cache@v6
        with:
          path: ~/.cache/cargo-xwin
          key: xwin-${{ runner.os }}-v1

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: wind_input

      # fmt --check + clippy(msvc target) + test(本机)
      - name: dev.sh ci
        run: ./scripts/dev.sh ci

      # headless/Android 防走样三道闸:
      # ① check 对象是 **wind-mobile 全包**(移动端门面,闭包含 coordinator headless):
      #    同时锁三件事——headless 可编译、依赖闭包过 Android、wind-ui-types 没长出
      #    无条件平台依赖。此前只 check coordinator,主线改动破坏门面要等安卓仓 build 才炸。
      #
      #    ⚠ 曾经 check 的是 wind-android 全包,还多锁一件「FFI 层自身(uniffi 宏/cdylib/
      #    tracing-android 的 cfg 分支)在 Android target 可编」。绑定层搬去 WindInputAndroid
      #    仓后这一件**本仓锁不住了**,由该仓 scripts/build-rust.ps1 交叉编译真 .so 时把关
      #    (比 check 更强,但反馈晚一个仓)。改动 wind-mobile 的公开面时请顺手跑一次安卓仓构建。
      # ② tree-grep 断言依赖边本身——wind-ui 的平台代码全在 cfg 内,理论上可能在 android
      #    下编成空壳而不报错,①抓不到"coordinator 又直连 wind-ui"的回归,须对边断言。
      # ③ C 依赖卫兵:webdata(wind-transfer→zip→zstd-sys/bzip2-sys、fontdb)独立成
      #    wind-webdata 后,Android 闭包为纯 Rust——check 因此**不再需要 NDK**,本机也可跑。
      #    刻意不配 NDK 环境变量:谁把 -sys crate 混回闭包,这一步会当场编不过而暴露。
      - name: wind-mobile headless (aarch64-linux-android)
        working-directory: wind_input
        run: cargo check -p wind-mobile --target aarch64-linux-android

      - name: android 依赖树无 wind-ui / 无 C 依赖
        working-directory: wind_input
        run: |
          ! cargo tree -p wind-coordinator --no-default-features -e normal | grep -q "wind-ui v"
          ! cargo tree -p wind-mobile --target aarch64-linux-android -e normal | grep -qE "zstd-sys|bzip2-sys|fontdb"

      # 平台差异只能由运行期 InputProfile 决定。编译期的 `cfg!(target_os = "android")` 会让主机
      # 上永远只测到桌面那一支，移动分支无人覆盖——这条守着它不被写回协调器 / 引擎。
      - name: 协调器与引擎无编译期平台判断
        working-directory: wind_input
        run: |
          ! grep -rnE 'cfg!\(target_os = "android"\)|use_mobile_overrides' crates/wind-coordinator/src crates/wind-engine/src

      # wind_tsf 里被刻意剥出来的纯逻辑（判据/表结构，不含 Win32 头）——g++ 就能跑，
      # 约 10 秒。⚠ 上面那步交叉编译只保证 DLL 能编出来，**一条断言都不会执行**；
      # 这些测试此前只有手敲 g++ 才跑得到，等于不存在。在「游戏兼容这类改动无法在
      # CI 里真机验」的前提下，它们是唯一会自动执行的判据闸门，故单列一步。
      # 按通配取全部 *_test.cpp：手写清单曾漏掉一半（新测试只登记了 CMake），等于没跑。
      - name: wind_tsf 纯逻辑单测
        run: |
          set -e
          for f in wind_tsf/tests/*_test.cpp; do
            t="$(basename "$f" .cpp)"
            g++ -std=c++17 -Wall -Wextra -Iwind_tsf/include -o "/tmp/$t" "$f"
            "/tmp/$t"
          done

      - name: 交叉编译 TSF DLL (x64 + x86)
        run: |
          V="$(tr -d '[:space:]' < docs/VERSION)"
          make -C wind_tsf VERSION="$V"
          make -C wind_tsf x86 VERSION="$V"

  # Linux 门禁: wind_linux addon 纯逻辑单测 + 服务端 linux-host 形态。
  # 单测走仓库 canonical 的 Makefile 入口（g++ 直接编，不需要 Fcitx5 / CMake）；
  # protocol_sync_test 已覆盖 Rust ↔ C++ 协议 id，故不再重复跑 CMake/ctest。
  # 不做路径过滤：PR 全量跑；push 只按文件顶部的 docs/** 与 **.md 忽略规则跳过，
  # 改 wind-ipc / 服务端 feature / 工作区清单时都会触发，不会因漏列路径而失守。
  linux-check:
    name: Linux Addon & Service
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: 安装 C++ 单测依赖
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends g++

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: wind_input

      - name: wind_linux 单测
        run: make -C wind_linux test

      - name: wind_service linux-host 编译检查
        working-directory: wind_input
        run: cargo check -p wind_service --features linux-host

  # 门控: 仅当 macOS 相关路径改动时才触发 macOS 编译校验。
  # GitHub 不支持 per-job paths, 故用一个 ubuntu 廉价 job 输出是否命中, macos-check 据此 if 短路。
  changes:
    name: Detect macOS-related changes
    runs-on: ubuntu-latest
    outputs:
      macos: ${{ steps.filter.outputs.macos }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            macos:
              - 'wind_macos/**'
              - 'wind_input/**'
              - 'scripts/mac/**'

  # macOS 门禁: Swift 与 Rust 双侧编译 + 单测, 不打包 .app(打包见 release.yml)。
  #
  # 为什么这里必须真跑测试和 clippy, 而不是像原来那样只 build/check:
  # 上面的 check job 全程针对 x86_64-pc-windows-msvc, 一切 #[cfg(target_os = "macos")]
  # 的代码对它都不存在 —— 而 macOS 侧的定位/截图/主题/热键都是大段 cfg 独有实现。
  # 只 cargo check 也不够: check 不做单态化与代码生成, 测试更是完全不跑。
  macos-check:
    name: macOS Build & Test
    needs: changes
    if: needs.changes.outputs.macos == 'true'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: wind_input

      # 临时诊断（不合入）：复现 wind-ui 单测在 macOS runner 上 comment_above_tests 卡约 16 分钟。
      # 单独跑 wind-ui 的 lib 测试，90 秒仍未结束就对测试进程 sample 栈。
      - name: 诊断 wind-ui 单测卡死
        working-directory: wind_input
        run: |
          set +e
          sysctl -n hw.ncpu
          cargo test -p wind-ui --lib --no-run --message-format=json > /tmp/build.json
          BIN=$(jq -r 'select(.executable!=null and .profile.test==true) | .executable' /tmp/build.json | tail -1)
          echo "BIN=$BIN"
          START=$(date +%s)
          "$BIN" --test-threads=3 > /tmp/t.log 2>&1 &
          PID=$!
          for i in $(seq 1 18); do
            sleep 5
            kill -0 $PID 2>/dev/null || break
          done
          if kill -0 $PID 2>/dev/null; then
            echo "=== 90s 仍在运行，采样 ==="
            ps -o pid,etime,state,command -p $PID
            sample $PID 10 -file /tmp/sample.txt
            cat /tmp/sample.txt | head -400
            echo "=== 再等 60s 看是否自行结束 ==="
            for i in $(seq 1 12); do sleep 5; kill -0 $PID 2>/dev/null || break; done
            kill -0 $PID 2>/dev/null && { echo "=== 150s 仍未结束，第二次采样 ==="; sample $PID 5 -file /tmp/sample2.txt; head -200 /tmp/sample2.txt; kill -9 $PID; }
          else
            echo "=== 已在 $(( $(date +%s) - START ))s 内结束（未复现）==="
          fi
          echo "=== 测试日志 ==="
          grep -E "running for over|test result|FAILED" /tmp/t.log
          tail -30 /tmp/t.log
