name: Bug 反馈
description: 报告一个 Bug 帮助我们改进
labels: ["缺陷"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你提交 Bug 反馈！请尽量详细地描述问题，以便我们复现和修复。

        > ### 📋 输入相关的问题，请附上日志
        > 一份日志能省掉十轮来回。**抓取方式：**
        > 1. 设置 → **高级 → 日志设置**，把「输入法服务日志级别」和「TSF 端日志级别」调到 `debug`，然后**重启输入法服务**和出问题的程序
        > 2. 能稳定复现的：先点 **日志打包 → 清理**，重启输入法服务，**干净复现一次**，再点 **打包到桌面**
        > 3. 偶发、不是百分百复现的：不用清理，**写清楚出问题的时间点**，尽快打包即可
        > 4. 把桌面上生成的 zip 拖进下方「截图或日志」
        >
        > ⚠️ debug 日志含你输入的内容，发之前请自查；排查完记得把级别调回去。完整说明：[反馈问题时如何提交日志](https://windinput.com/docs/reference/report-logs)

  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 请清晰、简洁地描述你遇到的问题
      placeholder: 在某某场景下，输入法出现了某某异常行为……
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: 请提供能复现此问题的操作步骤
      placeholder: |
        1. 切换到清风输入法
        2. 打开某某应用
        3. 输入 '...'
        4. 出现异常
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望行为
      description: 你期望的正确行为是什么？
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际行为
      description: 实际发生了什么？
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: 清风输入法版本
      description: 可在设置工具的「关于」中查看
      placeholder: "0.0.1-alpha"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: 操作系统
      options:
        - Windows 11
        - Windows 10
        - macOS
        - Linux
    validations:
      required: true

  - type: input
    id: os-version
    attributes:
      label: 系统版本
      description: 如 Windows 11 24H2、macOS 15.1；Linux 请写发行版与桌面会话，如 Ubuntu 24.04 / KDE Plasma 6（Wayland）
      placeholder: "Windows 11 24H2"

  - type: dropdown
    id: install-type
    attributes:
      label: 安装方式
      options:
        - Windows 安装包 (Setup.exe)
        - Windows 便携版 (Portable.zip)
        - macOS 安装包 (pkg)
        - Linux 安装包 (deb)
        - 源码构建
    validations:
      required: true

  - type: dropdown
    id: schema
    attributes:
      label: 当前使用的输入方案
      options:
        - 五笔 86
        - 五笔拼音混输
        - 全拼
        - 双拼
        - 其他（请在描述中说明）
    validations:
      required: false

  - type: textarea
    id: app
    attributes:
      label: 出现问题的应用程序
      description: 在哪个应用中出现了此问题？（如 Edge、VS Code、微信等）
      placeholder: Microsoft Edge

  - type: input
    id: occurred-at
    attributes:
      label: 问题发生的时间点
      description: 精确到分钟，日志里靠它定位。偶发问题尤其必填
      placeholder: "2026-11-12 14:32 左右"

  - type: textarea
    id: screenshots
    attributes:
      label: 截图或日志
      description: |
        请把设置「高级 → 日志设置 → 日志打包 → 打包到桌面」生成的 zip 拖到这里（抓取方式见页面顶部）。
        没法用一键打包时，手动打包日志目录：
        - Windows 安装版：`%LOCALAPPDATA%\WindInput\logs\`
        - Windows 便携版：`<程序目录>\localdata\logs\`
        - macOS：`~/Library/Application Support/WindInput/logs/`
        - Linux：`~/.local/share/WindInput/logs/`

  - type: textarea
    id: additional
    attributes:
      label: 其他信息
      description: 其他你认为有帮助的信息（自定义配置、特殊环境等）
