[package]
name = "wind_extension_host"
version.workspace = true
edition.workspace = true

[[bin]]
name = "wind_input_ext"
path = "src/main.rs"

[build-dependencies]
# 仅 Windows 目标嵌入图标/版本信息
winresource = "0.1"

[dependencies]
wind-hook = { path = "../../crates/wind-hook" }
serde_json = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows = { workspace = true }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
