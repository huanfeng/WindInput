[package]
name = "wind_service"
version.workspace = true
edition.workspace = true

[[bin]]
name = "wind_input"
path = "src/main.rs"

[build-dependencies]
# 仅 Windows 目标嵌入图标/版本信息/manifest（DPI 感知等）
winresource = "0.1"

[features]
default = []
# Linux 发行形态：协调器/UI/桥接全部按外部宿主（Fcitx5 addon）呈现。
linux-host = ["wind-coordinator/linux-host", "wind-ui/linux-host", "wind-bridge/linux-host"]

[dependencies]
wind-ipc = { path = "../../crates/wind-ipc" }
wind-coordinator = { path = "../../crates/wind-coordinator" }
wind-webdata = { path = "../../crates/wind-webdata" }
wind-bridge = { path = "../../crates/wind-bridge" }
wind-config = { path = "../../crates/wind-config" }
wind-store = { path = "../../crates/wind-store" }
wind-dict = { path = "../../crates/wind-dict" }
wind-engine = { path = "../../crates/wind-engine" }
wind-ui = { path = "../../crates/wind-ui" }
wind-theme = { path = "../../crates/wind-theme" }
wind-rpc = { path = "../../crates/wind-rpc" }
wind-hook = { path = "../../crates/wind-hook" }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }
file-rotate = { workspace = true }
chrono = "0.4"
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
# 单例（flock）
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows = { workspace = true }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
