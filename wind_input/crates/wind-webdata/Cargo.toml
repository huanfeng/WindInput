[package]
name = "wind-webdata"
version.workspace = true
edition.workspace = true

[dependencies]
# 依赖方向是本 crate → coordinator（反过来会把 wind-transfer/fontdb 拉回
# Android 闭包）；移动端形态（wind-mobile）不依赖本 crate。
wind-coordinator = { path = "../wind-coordinator", default-features = false }
wind-config = { path = "../wind-config" }
wind-engine = { path = "../wind-engine" }
# 内存诊断读词库缓存策略的累计字节（wind_dict::mapping）。
wind-dict = { path = "../wind-dict" }
wind-aux-code = { path = "../wind-aux-code" }
wind-store = { path = "../wind-store" }
# 短语分发导入的能力分级（`phrase.previewImportText`）读 cmdbar 的函数 registry。
wind-cmdbar = { path = "../wind-cmdbar" }
wind-reverse = { path = "../wind-reverse" }
wind-theme = { path = "../wind-theme" }
wind-candidate = { path = "../wind-candidate" }
wind-keys = { path = "../wind-keys" }
wind-transfer = { path = "../wind-transfer" }
anyhow = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
chrono = "0.4"
fontdb = "0.22"

[dev-dependencies]
# 只供测试对照内置格式表条数（quick.list 不该漏条目）。
wind-quick-input = { path = "../wind-quick-input" }
wind-bridge = { path = "../wind-bridge" }
# 手工构造 .wpkg 用（export_package 写不出带说明的 package.toml）；
# 与 wind-transfer 同一版本、同一组 feature（取舍理由见那边）。
zip = { version = "2", default-features = false, features = ["deflate", "time"] }

[lints]
workspace = true
