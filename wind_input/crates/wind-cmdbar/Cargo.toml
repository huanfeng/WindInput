[package]
name = "wind-cmdbar"
version.workspace = true
edition.workspace = true

[dependencies]
tracing = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
chrono = "0.4"
regex = "1"
base64 = "0.22"
# `uuid()` 函数 / 短语 `$uuid` 变量的随机 UUID 生成
uuid = { workspace = true }
# `${APP_DIR}` 等内部目录变量的单一真相源（词法层展开时查表；见 wind_config::dir_var）
wind-config = { path = "../wind-config" }
# 农历换算与中文数字读法：`date()` 的记号与短语 `$变量` 同源（纯逻辑，无平台依赖）。
wind-quick-input = { path = "../wind-quick-input" }

[lints]
workspace = true
