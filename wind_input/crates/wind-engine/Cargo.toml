[package]
name = "wind-engine"
version.workspace = true
edition.workspace = true

[dependencies]
wind-utils = { path = "../wind-utils" }
wind-candidate = { path = "../wind-candidate" }
wind-dict = { path = "../wind-dict" }
wind-store = { path = "../wind-store" }
wind-config = { path = "../wind-config" }
# 只用 parser（`plain_type_text`），判整句里哪些 `$CC` 词条是纯文本直通；不求值。
wind-cmdbar = { path = "../wind-cmdbar" }
tracing = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_yaml = { workspace = true }
toml = { workspace = true }
# 英文词组分词索引落盘后 mmap 读（`english_phrase.rs`）。版本与 wind-dict 同一条，不引入新依赖。
memmap2 = "0.9"

[features]
# 评测专用的分阶段计时（`src/prof.rs`），生产构建不开。
aux-prof = []
# 另在辅码校验的逐字判定里取 TSC（开销大，只用来看占比）。
aux-prof-fine = ["aux-prof"]

[target.'cfg(windows)'.dev-dependencies]
# 只给「禁用词库后文件不再被占用」那条 e2e 用：判据必须走 `DeleteFileW`。
# Rust std 的 `remove_file`/`rename` 在新版 Windows 上不被 mmap 阻止 —— 实测连必定被映射的
# 主库 wdat 都能改名，用它们根本测不出用户遇到的占用。
windows = { workspace = true }

[dev-dependencies]
wind-config = { path = "../wind-config" }
# 供集成测试按**生产同源**的规则算缓存路径（`cache_ns`）——手工拼 namespace/stem
# 已经错过一次：把随包分发的 `<源>.dict.wdat` 当成了运行时缓存，测试因此测了个空。
wind-dict = { path = "../wind-dict" }

[lints]
workspace = true
