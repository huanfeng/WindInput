[package]
name = "wind-ui"
version.workspace = true
edition.workspace = true

[dependencies]
# 表现层协议类型（UiCommand/UiEvent 等）的定义处；本 crate 原路径 pub use 再导出。
wind-ui-types = { path = "../wind-ui-types" }
wind-theme = { path = "../wind-theme" }
wind-candidate = { path = "../wind-candidate" }
wind-bridge = { path = "../wind-bridge" }
# 协议常量与结构：语言栏图标 SHM 的尺寸档与变体表（langbar_icon）、host-render 常量
# （HOST_WINDOW_CANDIDATE / HostRenderHitRect）、macOS forwarder 的帧编码。
#
# 置于通用依赖而非 target-specific：langbar_icon 的几何绘制与合成是平台无关逻辑，
# 其单元测试要能在 CI 的 Linux test job 上跑到。经 wind-bridge 本就传递依赖它，
# 提为直接依赖不增加任何编译成本。
wind-ipc = { path = "../wind-ipc" }
# 显示浮窗前的最后一道闸（`wind_keys::foreground::exclusive_fullscreen_recent`）：独占全屏的
# 游戏被别的进程的窗口盖一下就会被踢出独占态，协调器那份事件驱动的缓存过期时由这里兜住。
# 曾只在 macOS 下依赖（全局热键的 VK 表），现在两个平台都要。
wind-keys = { path = "../wind-keys" }
# 仅用于 startup_trace：UI 线程若在窗口创建阶段退出，主线程与主日志都可能毫无察觉
wind-config = { path = "../wind-config" }
tiny-skia = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
image = { workspace = true }
resvg = "0.44"
# 截图文件名的本地时间戳（非 Windows 分支；Windows 用 GetLocalTime）
chrono = "0.4"

[target.'cfg(windows)'.dependencies]
# 局部追加 StationsAndDesktops：诊断浮层归属的桌面/窗口站（见 window.rs 的
# current_desktop_name）。在此声明而非改 workspace 定义，避免影响其它 crate 的配置。
windows = { workspace = true, features = ["Win32_System_StationsAndDesktops"] }
# `#[implement]` 宏展开引用 `::windows_core`，需作为直接依赖（版本随 windows 0.58）。
windows-core = "0.58"

# macOS：CoreText 真字形文本后端（text/coretext.rs）。
# （wind-ipc 已提为通用依赖，manager_macos forwarder 的帧编码照旧可用。）
[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
core-foundation-sys = "0.8"
core-graphics = "0.25"
core-text = "22.0.0"
# 全局热键（global_hotkey_macos）复用 key_inject 的 VK → CGKeyCode 表（wind-keys 已是通用依赖）。
# 扩展信封的 JSON body（`shot.panel` 等）。手拼字符串在这里不安全：路径里可能有
# 引号或反斜杠，转义漏一处就是对端解不出的坏包。
serde_json = { workspace = true }
# AppKit 绑定：软键盘面板（mac_panel.rs）是本仓 macOS 上**唯一**由服务进程自己开的窗口，
# 其余浮窗都在 `.app` 侧，理由见该模块头。
#
# ⚠️ 两个 objc2-* 都关掉 default-features 再按需开：objc2-app-kit 默认会打开 300 余个
# feature（每个 AppKit 类一个），全开会把这个 crate 的冷编译时间拖长好几倍，而我们只
# 用得上一个 NSPanel、一个 NSView 和它们周边那几个类型。新用到别的类时在这里补一行，
# 别图省事改回 default。
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSGeometry",
    "NSString",
    "NSArray",
    "NSValue",
    "NSObjCRuntime",
    "NSEnumerator",
    "NSThread",
    # 读系统键盘重复设置（NSGlobalDomain 的 InitialKeyRepeat / KeyRepeat），
    # 对位 Windows 的 SPI_GETKEYBOARDDELAY / SPI_GETKEYBOARDSPEED。
    "NSUserDefaults",
] }
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "NSApplication",
    "NSWindow",
    "NSPanel",
    "NSView",
    "NSResponder",
    "NSEvent",
    "NSScreen",
    "NSColor",
    "NSTrackingArea",
    "NSGraphics",
    "NSGraphicsContext",
    "objc2-core-foundation",
    # NSApplicationActivationPolicy 定义在这里（setActivationPolicy 归它门控）。
    "NSRunningApplication",
] }
# CGImage 的裸指针（`ForeignType::as_ptr`）——贴到 CALayer.contents 上需要它。
# core-graphics 0.25 的 foreign_type! 就出自本 crate，版本必须与它一致。
foreign-types = "0.5"

[target.'cfg(target_os = "macos")'.dev-dependencies]
dispatch2 = "0.3"

[lints]
workspace = true
