[package]
name = "wind-mobile"
version.workspace = true
edition.workspace = true

# 移动端形态的核心门面。**平台绑定层不在这里**——它住在各自的平台仓
# （Android: WindInputAndroid/rust/wind-android），只经本 crate 一条 path 依赖对接。
#
# 因此这里不该出现 uniffi / jni / objc 之类的绑定框架依赖：本 crate 一旦沾上某个
# 平台的绑定框架，"接口层"就退化成"那个平台的实现层"，第二个平台再来就只能复制粘贴。
[dependencies]
wind-coordinator = { path = "../wind-coordinator", default-features = false }
wind-host = { path = "../wind-host" }
wind-bridge = { path = "../wind-bridge" }
wind-config = { path = "../wind-config" }
wind-ipc = { path = "../wind-ipc" }
# 引导键的键名 ↔ 字符对照（设置端的触发键控件与工具栏入口共用，见 symbol_keys）
wind-keys = { path = "../wind-keys" }
wind-ui-types = { path = "../wind-ui-types" }
# 设置页「统计」的数据：报表算法在 wind-store（与桌面 wind-webdata 共用一份，见 stats_report）
wind-store = { path = "../wind-store" }
# 设置页「命令短语」的预览：按候选同一条求值路径展开模板（日期、符号组名）。两者 coordinator 本就依赖
wind-phrase = { path = "../wind-phrase" }
# 方案包导入 / 预览 / 删除（设置页「导入方案」），与桌面共用一份实现
wind-transfer = { path = "../wind-transfer" }
# 数据同步（进程内运行，见 sync.rs）。网络与加密依赖由 wind_sync_host 带入，须能为 Android 目标编译。
wind_sync_host = { path = "../../apps/sync" }
wind-sync = { path = "../wind-sync" }
wind-sync-ipc = { path = "../wind-sync-ipc" }
serde_json = { workspace = true }
chrono = "0.4"
tracing = { workspace = true }
# 配置快照的序列化与写入值的构造（见 config_api）。配置文件本身就是 TOML，
# 宿主侧也已有解析器，用同一种表示就不需要第二套映射。
toml = { workspace = true }

[lints]
workspace = true

[dev-dependencies]
tempfile = "3"
